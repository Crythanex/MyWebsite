<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Crythane</title>

<style>

/* ================= Fonts ================= */

@font-face{
  font-family:"Righteous";
  src:url("fonts/Righteous-Regular.ttf");
  font-display:swap;
}

@font-face{
  font-family:"Urbanist";
  src:url("fonts/Urbanist-Bold.ttf");
  font-display:swap;
}

@font-face{
  font-family:"Alimama";
  src:url("fonts/AlimamaShuHeiTi-Bold.ttf");
  font-display:swap;
}

@font-face{
  font-family:"Harmony";
  src:url("fonts/HarmonyOS_Sans_SC_Regular.ttf");
  font-display:swap;
}

@font-face{
  font-family:"Kazesawa";
  src:url("fonts/Kazesawa-Bold.ttf");
  font-display:swap;
}

/* ================= Root ================= */

:root{
  --bg:#0e1620;
  --text:#eef7f8;
  --accent:#73e6eb;
  --radius:32px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Urbanist","Alimama",-apple-system,sans-serif;
  overflow:hidden;
}

body.lang-zh{
  font-family:"Urbanist","Alimama",-apple-system,sans-serif;
}

body.lang-en{
  font-family:"Urbanist",-apple-system,sans-serif;
}

body.lang-jp{
  font-family:"Kazesawa","Urbanist",sans-serif;
}

/* ================= Splash ================= */

#splash{
  position:fixed;
  inset:0;
  background:#0e1620;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}

#logo{
  width:340px;
  max-width:74vw;
}

#logo text{
  font-family:"Righteous";
  font-size:96px;
  fill:none;
  stroke:var(--accent);
  stroke-width:3.2;
  stroke-dasharray:700;
  stroke-dashoffset:700;
  animation:
    draw 1.7s cubic-bezier(.22,.61,.36,1) forwards,
    fill .55s ease forwards 1.65s;
}

@keyframes draw{
  to{ stroke-dashoffset:0; }
}

@keyframes fill{
  to{ fill:var(--accent); }
}

#splash.fade{
  animation:splashOut .85s ease forwards;
}

@keyframes splashOut{
  to{ opacity:0; visibility:hidden; }
}

/* ================= Page ================= */

.page{
  opacity:0;
  transition:opacity .7s;
}

/* ================= Header ================= */

.header{
  position:sticky;
  top:0;
  z-index:10;
  padding:
    calc(16px + env(safe-area-inset-top))
    24px
    16px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(15,22,30,.52);
  backdrop-filter:blur(26px) saturate(160%);
  -webkit-backdrop-filter:blur(26px) saturate(160%);
}

.title{
  font-family:"Righteous";
  font-size:30px;
  letter-spacing:.5px;
  color:var(--accent);
  opacity:0;
  transform:translateY(-10px);
  transition:.55s cubic-bezier(.22,.61,.36,1);
}

.header.show-title .title{
  opacity:1;
  transform:translateY(0);
}

/* ================= Language ================= */

.lang-switch{
  position:absolute;
  right:24px;
  top:50%;
  transform:translateY(-50%);
}

.lang-btn{
  width:40px;
  height:32px;
  border-radius:10px;
  border:1px solid rgba(115,230,235,.35);
  background:rgba(255,255,255,.04);
  color:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.18s;
}

.lang-btn:active{
  transform:scale(.92);
}

.lang-btn svg{
  width:18px;
  height:18px;
}

.lang-menu{
  position:absolute;
  right:0;
  top:42px;
  display:flex;
  flex-direction:column;
  background:rgba(18,26,34,.92);
  border-radius:12px;
  padding:8px 0;
  opacity:0;
  pointer-events:none;
  transform:translateY(-6px);
  transition:.25s;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 10px 35px rgba(0,0,0,.35);
}

.lang-menu.show{
  opacity:1;
  pointer-events:auto;
  transform:translateY(0);
}

.lang-menu div{
  padding:10px 18px;
  cursor:pointer;
  font-size:14px;
  white-space:nowrap;
  transition:.18s;
}

.lang-menu div:hover{
  background:rgba(255,255,255,.08);
}

/* ================= Avatar ================= */

.avatar-wrap{
  display:flex;
  justify-content:center;
  margin:58px 0 30px;
}

.avatar{
  width:200px;
  height:200px;
  border-radius:50%;
  background-image:url("fonts/1000075580.jpeg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  box-shadow:0 12px 40px rgba(0,0,0,.36);
}

/* ================= Intro ================= */

.intro{
  text-align:center;
  font-size:26px;
  margin-bottom:54px;
  transition:.55s cubic-bezier(.22,.61,.36,1);
}

.intro.absorb{
  transform:translateY(-70px);
  opacity:0;
}

/* ================= Apple Text ================= */

.apple-text span{
  display:inline-block;
  opacity:0;
  transform:translateY(14px);
  will-change:transform,opacity;
}

.apple-text span.show{
  opacity:1;
  transform:translateY(0);
  transition:
    opacity .55s cubic-bezier(.22,.61,.36,1),
    transform .55s cubic-bezier(.22,.61,.36,1);
}

/* ================= Cards ================= */

.card-list{
  padding:0 24px 70px;
  display:flex;
  flex-direction:column;
  gap:28px;
}

.card{
  border-radius:var(--radius);
  overflow:hidden;
  opacity:0;
  transform:translateY(48px) scale(.965);
  filter:blur(8px);
  transition:.9s cubic-bezier(.16,1,.3,1);
  background:rgba(20,31,38,.74);
  border:1px solid rgba(255,255,255,.05);
  box-shadow:0 16px 40px rgba(0,0,0,.28);
}

.card.show{
  opacity:1;
  transform:translateY(0) scale(1);
  filter:blur(0);
}

.card-main{
  aspect-ratio:5/3;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  position:relative;
  overflow:hidden;
}

.card-main::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(14,22,28,.16);
}

.card-main::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.30),rgba(0,0,0,0));
}

.card-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 24px;
  background:rgba(16,24,31,.68);
  border-top:1px solid rgba(255,255,255,.06);
  font-size:20px;
  color:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.arrow-btn{
  width:52px;
  height:52px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.92);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.14s;
}

.arrow-btn:active{
  transform:scale(.88);
}

.arrow-btn svg{
  width:22px;
  height:22px;
}

/* ================= Copyright ================= */

.copyright{
  text-align:center;
  padding:8px 24px 44px;
  font-size:13px;
  opacity:.42;
  letter-spacing:.25px;
  color:rgba(255,255,255,.72);
}

body.lang-zh .copyright{ font-family:"Harmony","Alimama",sans-serif; }
body.lang-en .copyright{ font-family:"Urbanist",sans-serif; }
body.lang-jp .copyright{ font-family:"Kazesawa",sans-serif; }

/* =============================================
   RESPONSIVE BREAKPOINTS
   ============================================= */

/* ── 小屏手机 ≤320px ── */
@media (max-width:320px){
  .avatar{ width:110px; height:110px; }
  .intro{ font-size:20px; margin-bottom:36px; }
  .card-list{ padding:0 14px 60px; gap:18px; }
  .card-footer{ font-size:17px; padding:16px 18px; }
  .arrow-btn{ width:42px; height:42px; }
  .arrow-btn svg{ width:18px; height:18px; }
}

/* ── iPad / 平板 900–1299px → 2列网格 ── */
@media (min-width:900px) and (max-width:1299px){
  .card-list{
    padding:0 40px 80px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:28px;
  }
  .avatar{ width:180px; height:180px; }
  .intro{ font-size:28px; }
  .avatar-wrap{ margin:64px 0 32px; }
}

/* ── 桌面 ≥1300px → 2列 + 大留白 ── */
@media (min-width:1300px){
  .card-list{
    padding:0 12vw 90px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:32px;
  }
  .avatar{ width:200px; height:200px; }
  .intro{ font-size:28px; }
}

/* ── Apple Watch ≤180px ── */
@media (max-width:180px){

  /* 跳过 splash */
  #splash{ display:none; }
  .page{ opacity:1 !important; }
  body{ overflow:auto; }

  .header{
    padding:8px 10px;
    justify-content:flex-start;
  }

  /* 语言切换在手表上无意义，隐藏 */
  .lang-switch{ display:none; }

  .title{
    font-size:16px;
    opacity:1 !important;
    transform:none !important;
    /* 手表上始终显示，不等滚动触发 */
  }

  .avatar-wrap{ margin:24px 0 14px; }
  .avatar{ width:60px; height:60px; }

  .intro{
    font-size:12px;
    margin-bottom:16px;
    padding:0 8px;
    line-height:1.5;
  }

  /* 卡片：隐藏图片区域，只保留文字行 */
  .card-list{
    padding:0 8px 32px;
    gap:8px;
    display:flex;
    flex-direction:column;
  }

  .card{ border-radius:12px; }
  .card-main{ display:none; }

  .card-footer{
    font-size:12px;
    padding:10px 12px;
    border-top:none;
  }

  .arrow-btn{
    width:26px;
    height:26px;
    flex-shrink:0;
  }

  .arrow-btn svg{
    width:13px;
    height:13px;
  }

  .copyright{
    font-size:9px;
    padding:4px 8px 16px;
    letter-spacing:0;
  }
}

</style>

</head>

<script>

/* ================= Splash ================= */

window.addEventListener("load", () => {

  // 手表端：跳过 splash，直接显示
  if (window.innerWidth <= 180) {
    document.body.style.overflow = "auto";
    document.querySelector(".page").style.opacity = 1;
    startPage();
    return;
  }

  setTimeout(() => {
    document.getElementById("splash").classList.add("fade");
    document.body.style.overflow = "auto";
    document.querySelector(".page").style.opacity = 1;
    startPage();
  }, 2000);

});

/* ================= Text Animation ================= */

function playAppleText(el) {

  const text = el.textContent.trim();
  el.textContent = "";

  const units = [...text];

  units.forEach((u, i) => {
    const s = document.createElement("span");
    s.innerHTML = u === " " ? "&nbsp;" : u;
    el.appendChild(s);

    setTimeout(() => {
      s.classList.add("show");
    }, i * 38);
  });
}

/* ================= Main ================= */

function startPage() {

  // 手表端跳过复杂动画
  const isWatch = window.innerWidth <= 180;

  if (!isWatch) {
    playAppleText(document.querySelector(".intro"));
  }

  const cards = [...document.querySelectorAll(".card")];

  const obs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("show");
      } else {
        entry.target.classList.remove("show");
      }
    });
  }, { threshold: .15 });

  cards.forEach(c => obs.observe(c));

  // 手表端不需要 header scroll 监听
  if (isWatch) return;

  const header = document.querySelector(".header");
  const intro  = document.querySelector(".intro");

  addEventListener("scroll", () => {
    if (scrollY > 80) {
      header.classList.add("show-title");
      intro.classList.add("absorb");
    } else {
      header.classList.remove("show-title");
      intro.classList.remove("absorb");
    }
  }, { passive: true }); // ← 节流修复：passive 避免阻塞滚动
}

/* ================= Language ================= */

const LANG = {

  zh: {
    intro:      "你好，这里是凌绡",
    intro_card: "自介",
    gallery:    "图库",
    commission: "约稿",
    projects:   "项目",
    contact:    "联络",
    friends:    "友链",
    donation:   "捐赠",
    copyright:  "版权所有 ©2023-2026 Crythane 保留所有权利"
  },

  en: {
    intro:      "Hey there, I am Crythane",
    intro_card: "Introduction",
    gallery:    "Gallery",
    commission: "Commission",
    projects:   "Project",
    contact:    "Contact",
    friends:    "Links",
    donation:   "Donation",
    copyright:  "Copyright ©2023-2026 Crythane. All rights reserved."
  },

  jp: {
    intro:      "ようこそ、凌绡（シノセン）へ",
    intro_card: "自己紹介",
    gallery:    "ギャラリー",
    commission: "コミッション",
    projects:   "プロジェクト",
    contact:    "連絡",
    friends:    "リンク",
    donation:   "寄付",
    copyright:  "Copyright ©2023-2026 Crythane All Rights Reserved."
  }

};

function setLang(lang, animate = false) {

  localStorage.setItem("lang", lang);

  document.body.classList.remove("lang-zh", "lang-en", "lang-jp");
  document.body.classList.add(`lang-${lang}`);

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (LANG[lang][key]) {
      el.textContent = LANG[lang][key];
    }
  });

  document.getElementById("copyright").textContent = LANG[lang].copyright;

  // 只在需要时播放文字动画（修复重复播放的 bug）
  if (animate) {
    playAppleText(document.querySelector(".intro"));
  }
}

/* Init：初始化时不播动画，等 startPage() 统一触发 */
const savedLang = localStorage.getItem("lang") || "zh";
setLang(savedLang, false);

/* ================= Lang Menu ================= */

const btn  = document.getElementById("langBtn");
const menu = document.getElementById("langMenu");

btn.onclick = (e) => {
  e.stopPropagation();
  menu.classList.toggle("show");
};

menu.querySelectorAll("[data-lang]").forEach(item => {
  item.onclick = () => {
    setLang(item.dataset.lang, true); // 切换时播动画
    menu.classList.remove("show");
  };
});

document.addEventListener("click", (e) => {
  if (!menu.contains(e.target) && !btn.contains(e.target)) {
    menu.classList.remove("show");
  }
});

</script>

<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Crythane</title>

<style>

/* ================= Fonts ================= */

@font-face{
  font-family:"Righteous";
  src:url("fonts/Righteous-Regular.ttf");
  font-display:swap;
}
@font-face{
  font-family:"Urbanist";
  src:url("fonts/Urbanist-bold.ttf");
  font-display:swap;
}
@font-face{
  font-family:"Alimama";
  src:url("fonts/AlimamaShuHeiTi-Bold.ttf");
  font-display:swap;
}
@font-face{
  font-family:"Harmony";
  src:url("fonts/HarmonyOS_Sans_SC_Regular.ttf");
  font-display:swap;
}
@font-face{
  font-family:"Kazesawa";
  src:url("fonts/Kazesawa-Bold.ttf");
  font-display:swap;
}

/* ================= Theme Variables ================= */

:root{
  --bg:        #081921;
  --bg2:       rgba(20,31,38,.74);
  --bg3:       rgba(16,24,31,.68);
  --header-bg: rgba(8,25,33,.52);
  --menu-bg:   rgba(18,26,34,.92);
  --text:      #eef7f8;
  --text2:     rgba(255,255,255,.94);
  --text3:     rgba(255,255,255,.72);
  --border:    rgba(255,255,255,.05);
  --border2:   rgba(255,255,255,.06);
  --border3:   rgba(255,255,255,.08);
  --btn-bg:    rgba(255,255,255,.05);
  --accent:    #73e6eb;
  --accent-border: rgba(115,230,235,.35);
  --card-img-overlay: rgba(14,22,28,.16);
  --splash-bg: #081921;
  --radius:    32px;
  --shadow:    0 16px 40px rgba(0,0,0,.28);
  --shadow-hover: 0 28px 60px rgba(0,0,0,.44);
  --avatar-shadow: 0 12px 40px rgba(0,0,0,.36);
  --avatar-glow:   0 0 0 0 rgba(115,230,235,0);
}

body.theme-light{
  --bg:        #f0f4f8;
  --bg2:       rgba(255,255,255,.82);
  --bg3:       rgba(240,244,250,.90);
  --header-bg: rgba(240,244,250,.70);
  --menu-bg:   rgba(255,255,255,.95);
  --text:      #1a2535;
  --text2:     rgba(20,35,55,.92);
  --text3:     rgba(20,35,55,.55);
  --border:    rgba(0,0,0,.07);
  --border2:   rgba(0,0,0,.08);
  --border3:   rgba(0,0,0,.10);
  --btn-bg:    rgba(0,0,0,.04);
  --accent:    #2ab8c4;
  --accent-border: rgba(42,184,196,.38);
  --card-img-overlay: rgba(240,244,250,.08);
  --splash-bg: #f0f4f8;
  --shadow:    0 16px 40px rgba(0,0,0,.10);
  --shadow-hover: 0 28px 60px rgba(0,0,0,.18);
  --avatar-shadow: 0 12px 40px rgba(0,0,0,.14);
  --avatar-glow:   0 0 0 0 rgba(42,184,196,0);
}

/* ================= Base ================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{ scroll-behavior:smooth; }

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Urbanist","Alimama",-apple-system,sans-serif;
  overflow:hidden;
  transition:background .35s, color .35s;
}

body.lang-zh{ font-family:"Urbanist","Alimama",-apple-system,sans-serif; }
body.lang-en{ font-family:"Urbanist",-apple-system,sans-serif; }
body.lang-jp{ font-family:"Kazesawa","Urbanist",sans-serif; }

/* ================= Theme Ripple Overlay ================= */

#theme-ripple{
  position:fixed;
  inset:0;
  z-index:998;
  pointer-events:none;
  overflow:hidden;
}

#theme-ripple::after{
  content:"";
  position:absolute;
  border-radius:50%;
  transform:scale(0);
  opacity:0;
  transition:none;
}

#theme-ripple.ripple-play::after{
  animation:themeRipple .6s cubic-bezier(.22,.61,.36,1) forwards;
}

@keyframes themeRipple{
  0%  { transform:scale(0);   opacity:1; }
  100%{ transform:scale(1);   opacity:0; }
}

/* ================= Splash ================= */

#splash{
  position:fixed;
  inset:0;
  background:var(--splash-bg);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
  transition:background .35s;
}

#logo{
  width:340px;
  max-width:74vw;
}

#logo text{
  font-family:"Righteous";
  font-size:96px;
  fill:none;
  stroke:var(--accent);
  stroke-width:3.2;
  stroke-dasharray:700;
  stroke-dashoffset:700;
  animation:
    draw 1.7s cubic-bezier(.22,.61,.36,1) forwards,
    fill-text .55s ease forwards 1.65s;
}

@keyframes draw{ to{ stroke-dashoffset:0; } }
@keyframes fill-text{ to{ fill:var(--accent); } }

#splash.fade{ animation:splashOut .85s ease forwards; }
@keyframes splashOut{ to{ opacity:0; visibility:hidden; } }

/* ================= Page ================= */

.page{
  opacity:0;
  visibility:hidden;
  transition:opacity .7s, visibility .7s;
}

/* ================= Header ================= */

.header{
  position:sticky;
  top:0;
  z-index:10;
  padding:calc(16px + env(safe-area-inset-top)) 24px 16px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:var(--header-bg);
  backdrop-filter:blur(26px) saturate(160%);
  -webkit-backdrop-filter:blur(26px) saturate(160%);
  transition:background .35s;
}

.title{
  font-family:"Righteous";
  font-size:30px;
  letter-spacing:.5px;
  color:var(--accent);
  opacity:0;
  visibility:hidden;
  transform:translateY(-10px);
  transition:
    opacity .55s cubic-bezier(.22,.61,.36,1),
    transform .55s cubic-bezier(.22,.61,.36,1),
    visibility .55s,
    color .35s;
}

.header.show-title .title{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

/* ================= Theme Switch ================= */

.theme-switch{
  position:absolute;
  left:24px;
  top:50%;
  transform:translateY(-50%);
}

.theme-btn{
  width:40px;
  height:32px;
  border-radius:10px;
  border:1px solid var(--accent-border);
  background:var(--btn-bg);
  color:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:border-color .35s, background .35s, color .35s, transform .18s;
}

.theme-btn:active{ transform:scale(.92); }

.theme-btn svg{
  width:18px;
  height:18px;
  position:absolute;
  transition:opacity .25s, transform .35s cubic-bezier(.34,1.56,.64,1);
}

/* 图标切换带弹性旋转 */
.theme-btn .icon-moon{
  opacity:1;
  transform:rotate(0deg) scale(1);
}
.theme-btn .icon-sun{
  opacity:0;
  transform:rotate(-90deg) scale(.5);
}

body.theme-light .theme-btn .icon-moon{
  opacity:0;
  transform:rotate(90deg) scale(.5);
}
body.theme-light .theme-btn .icon-sun{
  opacity:1;
  transform:rotate(0deg) scale(1);
}

/* ================= Language ================= */

.lang-switch{
  position:absolute;
  right:24px;
  top:50%;
  transform:translateY(-50%);
}

.lang-btn{
  width:40px;
  height:32px;
  border-radius:10px;
  border:1px solid var(--accent-border);
  background:var(--btn-bg);
  color:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:border-color .35s, background .35s, color .35s, transform .18s;
}

.lang-btn:active{ transform:scale(.92); }
.lang-btn svg{ width:18px; height:18px; }

.lang-menu{
  position:absolute;
  right:0;
  top:42px;
  display:flex;
  flex-direction:column;
  background:var(--menu-bg);
  border-radius:12px;
  padding:8px 0;
  opacity:0;
  pointer-events:none;
  transform:translateY(-6px) scale(.97);
  transform-origin:top right;
  transition:opacity .22s, transform .22s cubic-bezier(.34,1.56,.64,1);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 10px 35px rgba(0,0,0,.18);
  border:1px solid var(--border2);
}

.lang-menu.show{
  opacity:1;
  pointer-events:auto;
  transform:translateY(0) scale(1);
}

.lang-menu div{
  padding:10px 18px;
  cursor:pointer;
  font-size:14px;
  white-space:nowrap;
  color:var(--text);
  transition:background .18s, color .18s;
}

.lang-menu div:hover{ background:var(--border); }

/* ================= Avatar ================= */

.avatar-wrap{
  display:flex;
  justify-content:center;
  margin:58px 0 30px;
}

.avatar{
  width:200px;
  height:200px;
  border-radius:50%;
  background-image:url("fonts/1000075580.jpeg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  box-shadow:var(--avatar-shadow);
  transition:box-shadow .35s;
}

/* ================= Intro ================= */

.intro{
  text-align:center;
  font-size:26px;
  margin-bottom:54px;
  opacity:0;
  transition:.55s cubic-bezier(.22,.61,.36,1);
  color:var(--text);
}

.intro.absorb{
  transform:translateY(-70px);
  opacity:0;
}

/* ================= Apple Text ================= */

.apple-text span{
  display:inline-block;
  opacity:0;
  visibility:hidden;
  transform:translateY(14px);
  will-change:transform,opacity;
}

.apple-text span.show{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
  transition:
    opacity .55s cubic-bezier(.22,.61,.36,1),
    transform .55s cubic-bezier(.22,.61,.36,1),
    visibility .55s;
}

/* ================= Cards ================= */

.card-list{
  padding:0 24px 70px;
  display:flex;
  flex-direction:column;
  gap:28px;
}

/* 奇数卡从左、偶数卡从右滑入 */
.card{
  border-radius:var(--radius);
  overflow:hidden;
  opacity:0;
  visibility:hidden;
  transform:translateY(48px) scale(.965);
  filter:blur(8px);
  transition:.9s cubic-bezier(.16,1,.3,1);
  background:var(--bg2);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  cursor:pointer;
}

.card.show{
  opacity:1;
  visibility:visible;
  transform:translateY(0) scale(1);
  filter:blur(0);
}

/* 桌面 hover 上浮 */
@media (hover:hover){
  .card:hover{
    transform:translateY(-6px) scale(1.012);
    box-shadow:var(--shadow-hover);
  }
}

/* 移动端按下反馈 */
.card:active{
  transform:scale(.975);
  transition:transform .12s;
}

.card-main{
  aspect-ratio:5/3;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  position:relative;
  overflow:hidden;
  /* 视差容器 */
  will-change:transform;
}

/* 图片视差：由 JS 驱动，这里只设基础 */
.card-main::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--card-img-overlay);
}

.card-main::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.22),rgba(0,0,0,0));
}

.card-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 24px;
  background:var(--bg3);
  border-top:1px solid var(--border2);
  font-size:20px;
  color:var(--text2);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  transition:background .35s, color .35s, border-color .35s;
}

.arrow-btn{
  width:52px;
  height:52px;
  border-radius:50%;
  border:1px solid var(--border3);
  background:var(--btn-bg);
  color:var(--text2);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:background .35s, border-color .35s, color .35s, transform .18s;
  flex-shrink:0;
}

.arrow-btn:active{ transform:scale(.88); }
.arrow-btn svg{ width:22px; height:22px; }

/* ================= iOS Card Expand Transition ================= */

/* 展开克隆层：从卡片位置拉伸到全屏 */
#card-expand{
  position:fixed;
  z-index:997;
  border-radius:var(--radius);
  overflow:hidden;
  pointer-events:none;
  opacity:0;
  /* 初始位置由JS动态设置 */
  background:var(--bg2);
  will-change:transform,border-radius,opacity;
}

#card-expand.expanding{
  opacity:1;
  animation:cardExpand .46s cubic-bezier(.32,.72,0,1) forwards;
}

@keyframes cardExpand{
  to{
    top:0; left:0;
    width:100vw; height:100vh;
    border-radius:0;
    transform:none;
  }
}

/* 展开时背景轻微暗化 */
#card-expand-bg{
  position:fixed;
  inset:0;
  z-index:996;
  background:rgba(0,0,0,0);
  pointer-events:none;
  transition:background .38s;
}

#card-expand-bg.active{
  background:rgba(0,0,0,.22);
}

/* ================= Copyright ================= */

.copyright{
  text-align:center;
  padding:8px 24px 44px;
  font-size:13px;
  opacity:.42;
  letter-spacing:.25px;
  color:var(--text3);
  transition:color .35s;
}

body.lang-zh .copyright{ font-family:"Harmony","Alimama",sans-serif; }
body.lang-en .copyright{ font-family:"Urbanist",sans-serif; }
body.lang-jp .copyright{ font-family:"Kazesawa",sans-serif; }

/* =============================================
   RESPONSIVE
   ============================================= */

@media (max-width:320px){
  .avatar{ width:110px; height:110px; }
  .intro{ font-size:20px; margin-bottom:36px; }
  .card-list{ padding:0 14px 60px; gap:18px; }
  .card-footer{ font-size:17px; padding:16px 18px; }
  .arrow-btn{ width:42px; height:42px; }
  .arrow-btn svg{ width:18px; height:18px; }
}

@media (min-width:900px) and (max-width:1299px){
  .card-list{
    padding:0 40px 80px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:28px;
  }
  .avatar{ width:180px; height:180px; }
  .intro{ font-size:28px; }
  .avatar-wrap{ margin:64px 0 32px; }
}

@media (min-width:1300px){
  .card-list{
    padding:0 12vw 90px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:32px;
  }
  .avatar{ width:200px; height:200px; }
  .intro{ font-size:28px; }
}

@media (max-width:180px){
  #splash{ display:none; }
  .page{ opacity:1 !important; visibility:visible !important; }
  body{ overflow:auto; }
  .header{ padding:8px 10px; justify-content:flex-start; }
  .lang-switch{ display:none; }
  .theme-switch{ display:none; }
  .title{
    font-size:16px;
    opacity:1 !important;
    visibility:visible !important;
    transform:none !important;
  }
  .avatar-wrap{ margin:24px 0 14px; }
  .avatar{ width:60px; height:60px; }
  .intro{ font-size:12px; margin-bottom:16px; padding:0 8px; line-height:1.5; }
  .card-list{ padding:0 8px 32px; gap:8px; display:flex; flex-direction:column; }
  .card{ border-radius:12px; }
  .card-main{ display:none; }
  .card-footer{ font-size:12px; padding:10px 12px; border-top:none; }
  .arrow-btn{ width:26px; height:26px; }
  .arrow-btn svg{ width:13px; height:13px; }
  .copyright{ font-size:9px; padding:4px 8px 16px; letter-spacing:0; }
}

</style>

<script>

/* ================= Splash ================= */

window.addEventListener("load", () => {

  if (window.innerWidth <= 180) {
    const page = document.querySelector(".page");
    page.style.opacity = 1;
    page.style.visibility = "visible";
    document.body.style.overflow = "auto";
    startPage();
    return;
  }

  setTimeout(() => {
    document.getElementById("splash").classList.add("fade");
    const page = document.querySelector(".page");
    page.style.opacity = 1;
    page.style.visibility = "visible";
    document.body.style.overflow = "auto";
    startPage();
  }, 2000);

});

/* ================= Text Animation ================= */

function playAppleText(el) {
  el.style.opacity = "1";
  const text = el.textContent.trim();
  el.textContent = "";
  [...text].forEach((u, i) => {
    const s = document.createElement("span");
    s.innerHTML = u === " " ? "&nbsp;" : u;
    el.appendChild(s);
    setTimeout(() => s.classList.add("show"), i * 42);
  });
}

/* ================= iOS Card Expand Navigate ================= */

function navigateTo(url, cardEl) {
  if (!url || url === "#") return;

  const expand = document.getElementById("card-expand");
  const bg     = document.getElementById("card-expand-bg");
  const rect   = cardEl.getBoundingClientRect();

  // 把展开层定位到卡片当前位置
  expand.style.cssText = `
    top:    ${rect.top}px;
    left:   ${rect.left}px;
    width:  ${rect.width}px;
    height: ${rect.height}px;
    border-radius: var(--radius);
    background: var(--bg2);
  `;

  // 复制卡片背景图（让展开层看起来像卡片本身）
  const cardMain = cardEl.querySelector(".card-main");
  if (cardMain) {
    const bg2 = window.getComputedStyle(cardMain).backgroundImage;
    expand.style.backgroundImage  = bg2;
    expand.style.backgroundSize   = "cover";
    expand.style.backgroundPosition = "center";
  }

  bg.classList.add("active");

  // 强制重排后再加动画类，确保起始帧生效
  expand.offsetHeight;

  // 动态注入关键帧（目标是全屏）
  const existingKf = document.getElementById("expand-kf");
  if (existingKf) existingKf.remove();
  const kfStyle = document.createElement("style");
  kfStyle.id = "expand-kf";
  kfStyle.textContent = `
    @keyframes cardExpand{
      from{
        top:    ${rect.top}px;
        left:   ${rect.left}px;
        width:  ${rect.width}px;
        height: ${rect.height}px;
        border-radius: 32px;
        opacity: 1;
      }
      to{
        top:0; left:0;
        width:100vw; height:100dvh;
        border-radius:0px;
        opacity:1;
      }
    }
  `;
  document.head.appendChild(kfStyle);

  expand.classList.add("expanding");

  setTimeout(() => {
    window.location.href = url;
  }, 440);
}

/* ================= bfcache 修复：返回时重置展开层 ================= */
window.addEventListener("pageshow", (e) => {
  if (e.persisted) {
    const expand = document.getElementById("card-expand");
    const bg     = document.getElementById("card-expand-bg");
    expand.classList.remove("expanding");
    expand.style.cssText = "";
    bg.classList.remove("active");
  }
});

/* ================= Main ================= */

function startPage() {

  const isWatch = window.innerWidth <= 180;

  if (!isWatch) {
    playAppleText(document.querySelector(".intro"));
  }

  // 卡片交错入场（奇左偶右已由CSS设定，这里加延迟）
  const cards = [...document.querySelectorAll(".card")];

  const obs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("show");
      } else {
        entry.target.classList.remove("show");
      }
    });
  }, { threshold: .12 });

  cards.forEach(c => obs.observe(c));

  // 卡片点击退场跳转
  cards.forEach(card => {
    card.addEventListener("click", () => {
      const href = card.dataset.href;
      navigateTo(href, card);
    });
  });

  if (isWatch) return;

  const header = document.querySelector(".header");
  const intro  = document.querySelector(".intro");

  addEventListener("scroll", () => {
    if (scrollY > 80) {
      header.classList.add("show-title");
      intro.classList.add("absorb");
    } else {
      header.classList.remove("show-title");
      intro.classList.remove("absorb");
    }
  }, { passive: true });
}

/* ================= Theme Ripple ================= */

function setTheme(theme, originEl) {
  localStorage.setItem("theme", theme);

  // 从按钮位置扩散涟漪
  if (originEl) {
    const ripple = document.getElementById("theme-ripple");
    const rect   = originEl.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;
    const maxR = Math.hypot(
      Math.max(cx, window.innerWidth  - cx),
      Math.max(cy, window.innerHeight - cy)
    ) * 2;

    const after = ripple;
    after.style.setProperty("--cx", cx + "px");
    after.style.setProperty("--cy", cy + "px");
    after.style.setProperty("--r",  maxR + "px");

    // 涟漪颜色：切到浅色用浅色，切到深色用深色
    const rippleColor = theme === "light" ? "#f0f4f8" : "#081921";

    // 用伪元素模拟：直接插一个真实圆
    const circle = document.createElement("div");
    circle.style.cssText = `
      position:absolute;
      left:${cx}px; top:${cy}px;
      width:0; height:0;
      border-radius:50%;
      background:${rippleColor};
      transform:translate(-50%,-50%) scale(0);
      animation:rippleExpand .55s cubic-bezier(.22,.61,.36,1) forwards;
      pointer-events:none;
    `;

    // 注入动画
    if (!document.getElementById("ripple-style")) {
      const st = document.createElement("style");
      st.id = "ripple-style";
      st.textContent = `
        @keyframes rippleExpand{
          to{ width:${maxR}px; height:${maxR}px; opacity:0; }
        }
      `;
      document.head.appendChild(st);
    }

    ripple.appendChild(circle);
    setTimeout(() => circle.remove(), 600);
  }

  // 稍微延迟切换，让涟漪先出来
  setTimeout(() => {
    if (theme === "light") {
      document.body.classList.add("theme-light");
    } else {
      document.body.classList.remove("theme-light");
    }
  }, 60);
}

const savedTheme = localStorage.getItem("theme") || "dark";
setTheme(savedTheme, null);

document.getElementById("themeBtn").addEventListener("click", function() {
  const isLight = document.body.classList.contains("theme-light");
  setTheme(isLight ? "dark" : "light", this);
});

function setLang(lang, animate = false) {
  localStorage.setItem("lang", lang);
  document.body.classList.remove("lang-zh", "lang-en", "lang-jp");
  document.body.classList.add(`lang-${lang}`);

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (LANG[lang][key]) el.textContent = LANG[lang][key];
  });

  document.getElementById("copyright").textContent = LANG[lang].copyright;

  if (animate) {
    playAppleText(document.querySelector(".intro"));
  }
}

const savedLang = localStorage.getItem("lang") || "zh";
setLang(savedLang, false);

/* ================= Lang Menu ================= */

const langBtn  = document.getElementById("langBtn");
const langMenu = document.getElementById("langMenu");

langBtn.onclick = (e) => {
  e.stopPropagation();
  langMenu.classList.toggle("show");
};

langMenu.querySelectorAll("[data-lang]").forEach(item => {
  item.onclick = () => {
    setLang(item.dataset.lang, true);
    langMenu.classList.remove("show");
  };
});

document.addEventListener("click", (e) => {
  if (!langMenu.contains(e.target) && !langBtn.contains(e.target)) {
    langMenu.classList.remove("show");
  }
});

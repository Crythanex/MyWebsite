<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Crythane</title>
<meta property="og:title" content="凌绡 | Crythane" />
<meta property="og:description" content="Fursona · 内容创作 · 视觉设计" />
<meta property="og:image" content="img/Background.PNG" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="凌绡 | Crythane" />
<meta name="twitter:description" content="Fursona · 内容创作 · 视觉设计" />
<meta name="twitter:image" content="img/Background.PNG" />
<style>

/* ================= Fonts ================= */

@font-face{ font-family:"CaviarDreams"; src:url("fonts/CaviarDreams-Bold-2.ttf"); font-display:swap; }
@font-face{ font-family:"Urbanist";  src:url("fonts/Urbanist-Bold.ttf");     font-display:swap; }
@font-face{ font-family:"Alimama";   src:url("fonts/AlimamaShuHeiTi-Bold.ttf"); font-display:swap; }
@font-face{ font-family:"Harmony";   src:url("fonts/HarmonyOS_Sans_SC_Regular.ttf"); font-display:swap; }
@font-face{ font-family:"Kazesawa";  src:url("fonts/Kazesawa-Bold.ttf");     font-display:swap; }

/* ================= Theme Variables ================= */

:root{
  --bg:        #071720;
  --bg2:       rgba(12,26,36,.85);
  --bg3:       #091a24;
  --header-bg: rgba(8,25,33,.52);
  --menu-bg:   rgba(18,26,34,.92);
  --text:      #eef7f8;
  --text2:     rgba(255,255,255,.94);
  --text3:     rgba(255,255,255,.72);
  --border:    rgba(255,255,255,.05);
  --border2:   rgba(255,255,255,.06);
  --border3:   rgba(255,255,255,.08);
  --btn-bg:    rgba(255,255,255,.05);
  --accent:        #00e9f4;              /* 主行动色 — spinner/CTA */
  --accent-signal:  #73e6eb;              /* 装饰信号色 — meta line/hover装饰 */
  --accent-border:  rgba(0,233,244,.28);  /* 主行动色边框 */
  --card-img-overlay: rgba(14,22,28,.16);
  --splash-bg: #071720;
  --radius:    8px;
  --shadow:    none;
  --shadow-hover: none;
  --avatar-shadow: none;
}

body.theme-light{
  /* Apple color system */
  /* radius override */
  --bg:        #f5f5f7;   /* Frost — page canvas */
  --bg2:       #ffffff;   /* pure white card surface */
  --bg3:       #f4f8fb;   /* Ice — elevated wash */
  --header-bg: rgba(245,245,247,.80);
  --menu-bg:   rgba(255,255,255,.96);
  --text:      #1d1d1f;   /* Carbon — primary text */
  --text2:     #333333;   /* Smoke — secondary */
  --text3:     #707070;   /* Ash — muted */
  --border:    #d2d2d7;   /* hairline divider */
  --border2:   #c7c7cc;
  --border3:   #c7c7cc;
  --btn-bg:    #e2e2e5;
  --accent:        #0071e3;   /* Apple Blue — filled buttons only */
  --accent-link:   #0066cc;   /* Link Blue — outlined/secondary/hover */
  --accent-signal: #2997ff;   /* Signal Blue — decorative only */
  --accent-border: rgba(0,113,227,.25);
  --card-img-overlay: rgba(244,248,251,.06);
  --splash-bg: #f5f5f7;
  --shadow:    none;
  --shadow-hover: none;
  --avatar-shadow: none;
}

/* ================= Base ================= */

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ scroll-behavior:smooth; }

body{
  margin:0;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:"Urbanist","Alimama",-apple-system,sans-serif;
  overflow:hidden;
  touch-action:pan-y;
  letter-spacing:-0.016em;
  line-height:1.47;
  transition:background .35s cubic-bezier(.22,.61,.36,1), color .35s cubic-bezier(.22,.61,.36,1);
}

body.lang-zh{ font-family:"Urbanist","Alimama",-apple-system,sans-serif; }
body.lang-en{ font-family:"Urbanist",-apple-system,sans-serif; }
body.lang-jp{ font-family:"Kazesawa","Urbanist",sans-serif; }

/* ================= Theme Ripple ================= */

/* ================= Nav Transition (B) ================= */

.page.nav-out{
  opacity:0;
  transition:opacity .38s cubic-bezier(.4,0,1,1);
}

/* ================= Splash ================= */

#splash{
  position:fixed;
  inset:0;
  background:var(--splash-bg);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
  transition:background .35s cubic-bezier(.22,.61,.36,1);
}

#logo{ width:300px; max-width:68vw; }

#logo text{
  font-family:"CaviarDreams";
  font-size:96px;
  fill:none;
  stroke:var(--text);
  stroke-width:2.4;
  stroke-dasharray:700;
  stroke-dashoffset:700;
  animation:
    draw 1.6s cubic-bezier(.22,.61,.36,1) forwards,
    fill-text .5s cubic-bezier(.34,1.56,.64,1) forwards 1.55s;
}

@keyframes draw{ to{ stroke-dashoffset:0; } }
@keyframes fill-text{ to{ fill:var(--text); } }

/* 退场：logo上移淡出 + 背景同步淡出 */
#splash.fade{
  animation:splashBgOut .5s cubic-bezier(.22,.61,.36,1) forwards;
}
#splash.fade #logo{
  animation:logoSlideUp .5s cubic-bezier(.4,0,.2,1) forwards;
}

@keyframes splashBgOut{
  to{ opacity:0; visibility:hidden; }
}
@keyframes logoSlideUp{
  0%  { transform:translateY(0);    opacity:1; }
  100%{ transform:translateY(-60px); opacity:0; }
}

/* ================= Page ================= */

.page{
  opacity:0;
  visibility:hidden;
  max-width:1440px;
  margin:0 auto;
  transition:opacity .7s cubic-bezier(.22,.61,.36,1), visibility .7s cubic-bezier(.22,.61,.36,1);
}

/* ================= Header ================= */

.header{
  position:fixed;
  top:calc(16px + env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  padding:6px 6px 6px 16px;
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--header-bg);
  border:1px solid var(--border);
  border-radius:980px;
  backdrop-filter:blur(26px) saturate(160%);
  -webkit-backdrop-filter:blur(26px) saturate(160%);
  white-space:nowrap;
  transition:background .35s cubic-bezier(.22,.61,.36,1), border-color .35s cubic-bezier(.22,.61,.36,1);
}

.header-left{
  display:flex;
  align-items:center;
}

.header-right{
  display:flex;
  align-items:center;
  gap:6px;
}



.title{
  font-family:"CaviarDreams";
  font-size:17px;
  font-weight:700;
  letter-spacing:.02em;
  color:#fff;
  opacity:0;
  visibility:hidden;
  transform:translateY(-6px);
  transition:
    opacity .55s cubic-bezier(.22,.61,.36,1),
    transform .55s cubic-bezier(.22,.61,.36,1),
    visibility .55s,
    color .35s cubic-bezier(.22,.61,.36,1);
}

.header.show-title .title{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

/* 浅色模式 */
body.theme-light .title{ color:#1d1d1f; }

/* ================= Theme Switch ================= */

.theme-switch{
  position:relative;
}

.theme-btn{
  width:36px;
  height:32px;
  border-radius:980px;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.08);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
  transition:border-color .35s cubic-bezier(.22,.61,.36,1), background .35s cubic-bezier(.22,.61,.36,1), color .35s cubic-bezier(.22,.61,.36,1);
}

.theme-btn svg{
  width:16px; height:16px;
  position:absolute;
  transition:opacity .25s, transform .35s cubic-bezier(.34,1.56,.64,1);
}
.theme-btn .icon-moon{ opacity:1; transform:scale(1); }
.theme-btn .icon-sun{  opacity:0; transform:scale(.5) rotate(-90deg); }
body.theme-light .theme-btn .icon-moon{ opacity:0; transform:scale(.5) rotate(90deg); }
body.theme-light .theme-btn .icon-sun{  opacity:1; transform:scale(1); }

.theme-btn{
  border-color:var(--border3) !important;
  background:var(--btn-bg) !important;
  color:var(--text2) !important;
}

body.theme-light .theme-btn{
  border-color:#858585 !important;
  background:#e2e2e5 !important;
  color:#474747 !important;
}

.theme-btn:active{ transform:scale(.95); }

/* ================= Language ================= */

.lang-switch{
  position:relative;
}

.lang-btn{
  width:36px;
  height:32px;
  border-radius:980px;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.08);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:border-color .35s cubic-bezier(.22,.61,.36,1), background .35s cubic-bezier(.22,.61,.36,1), color .35s cubic-bezier(.22,.61,.36,1);
}
.lang-btn svg{ width:16px; height:16px; }

.lang-btn{
  border-color:var(--border3);
  background:var(--btn-bg);
  color:var(--text2);
}

body.theme-light .lang-btn{
  border-color:#858585;
  background:#e2e2e5;
  color:#474747;
}

.lang-btn:active{ transform:scale(.95); }

.lang-menu{
  position:absolute;
  right:0;
  top:42px;
  display:flex;
  flex-direction:column;
  background:var(--menu-bg);
  border-radius:16px;
  padding:8px 0;
  opacity:0;
  pointer-events:none;
  transform:translateY(-6px) scale(.97);
  transform-origin:top right;
  transition:opacity .22s, transform .22s cubic-bezier(.34,1.56,.64,1);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border2);
}

.lang-menu.show{ opacity:1; pointer-events:auto; transform:translateY(0) scale(1); }

.lang-menu div{
  padding:10px 18px;
  cursor:pointer;
  font-size:14px;
  white-space:nowrap;
  color:var(--text);
  transition:background .18s;
}

.lang-menu div:hover{ background:var(--border); }

/* ================= Hero ================= */

.hero{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
}

.hero-bg{
  position:absolute;
  /* 上下留出视差移动的空间，防止边缘露白 */
  inset:-20% 0;
  background-image:url("img/Background.PNG");
  background-size:cover;
  background-position:center;
  /* GPU合成层，消除抖动 */
  will-change:transform;
  transform:translate3d(0,0,0);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}

/* 渐变遮罩：底部让文字可读，顶部不过曝 */
.hero-bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      rgba(8,25,33,.18) 0%,
      rgba(8,25,33,0)   30%,
      rgba(8,25,33,0)   50%,
      rgba(8,25,33,.55) 80%,
      rgba(8,25,33,.88) 100%
    );
}

/* 浅色模式遮罩调整 */
body.theme-light .hero-bg::after{
  background:
    linear-gradient(
      to bottom,
      rgba(245,245,247,.04) 0%,
      rgba(245,245,247,0)   30%,
      rgba(245,245,247,0)   50%,
      rgba(245,245,247,.18) 80%,
      rgba(245,245,247,.72) 100%
    );
}

.hero-content{
  position:relative;
  z-index:2;
  padding:0 40px 64px;
  width:100%;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* 中文大标题 */
.hero-name-zh{
  font-family:"Alimama",sans-serif;
  font-size:clamp(40px, 8vw, 56px);
  line-height:1.07;
  color:#fff;
  letter-spacing:0.011em;
  margin:0 0 6px;
  /* 入场 */
  opacity:0;
  transform:translateY(30px);
  transition:opacity .8s .1s cubic-bezier(.22,.61,.36,1), transform .8s .1s cubic-bezier(.22,.61,.36,1);
}

body.theme-light .hero-name-zh{ color:#1d1d1f; }
body.theme-light .hero-name-en{ color:#1d1d1f; font-weight:400; }

/* 英文副标题 */
.hero-name-en{
  font-family:"CaviarDreams",sans-serif;
  font-size:14px;
  line-height:1.29;
  color:var(--text3);
  letter-spacing:.08em;
  font-weight:400;
  margin:0 0 20px;
  opacity:0;
  transform:translateY(24px);
  transition:opacity .8s .22s cubic-bezier(.22,.61,.36,1), transform .8s .22s cubic-bezier(.22,.61,.36,1);
}

/* tagline */
/* 入场触发 */
.hero-content.show .hero-name-zh,
.hero-content.show .hero-name-en{
  opacity:1;
  transform:translateY(0);
}

/* meta 行：细线 + 小字 */
.hero-meta{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-top:20px;
  opacity:0;
  transform:translateY(14px);
  transition:opacity .8s .34s cubic-bezier(.22,.61,.36,1), transform .8s .34s cubic-bezier(.22,.61,.36,1);
}
.hero-content.show .hero-meta{ opacity:1; transform:translateY(0); }

.hero-meta-line{
  display:block;
  width:24px;
  height:1px;
  background:currentColor;
  opacity:.35;
  flex-shrink:0;
}
body.theme-light .hero-meta-line{ background:#2997ff; opacity:.6; }
.hero-meta-line{ background:var(--accent-signal); opacity:.5; }

.hero-meta-text{
  font-size:12px;
  font-weight:400;
  line-height:1.33;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:rgba(255,255,255,.42);
}
body.theme-light .hero-meta-text{ color:#707070; }

/* ================= Section（卡片区） ================= */

.section{
  background:var(--bg);
  padding-top:64px;
  position:relative;
  transition:background .35s cubic-bezier(.22,.61,.36,1);
}

/* 浅色模式卡片区用Ice背景 */
body.theme-light .section{ background:var(--bg3); }

/* Hero → Section 融合层 */
.section::before{
  content:"";
  position:absolute;
  top:-80px;
  left:0;
  right:0;
  height:80px;
  background:linear-gradient(to bottom, transparent, var(--bg));
  pointer-events:none;
  z-index:1;
  transition:background .35s cubic-bezier(.22,.61,.36,1);
}

body.theme-light .section::before{
  background:linear-gradient(to bottom, transparent, var(--bg3));
}

/* ================= Cards ================= */

.card-list{
  padding:0 24px 80px;
  display:flex;
  flex-direction:column;
  gap:48px;
  max-width:980px;
  margin:0 auto;
  width:100%;
  overflow:hidden;
}

/* ── 卡片：左右分栏 ── */
.card{
  position:relative;
  height:300px;
  cursor:default;
  overflow:hidden;
  border-radius:25px;
}

/* 文字列 — 始终静止，绝对定位 */
.card-text{
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  width:88px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:1;
}

/* 偶数：文字在右 */
.card:nth-child(even) .card-text{
  left:auto;
  right:0;
}

/* 图片列 — 绝对定位，初始留出文字列宽度 */
.card-main{
  position:absolute;
  top:0;
  bottom:0;
  right:0;
  left:88px;          /* 奇数：左边留文字列 */
  border-radius:25px;
  overflow:hidden;
  background-color:var(--bg3);
  background-image:linear-gradient(135deg,rgba(0,233,244,.10) 0%,rgba(7,23,32,.5) 100%);
  opacity:0;
  visibility:hidden;
  /* 奇数：从右向左滑入 */
  transform:translateX(56px);
  transition:opacity 1.1s cubic-bezier(.22,.61,.36,1),
             visibility 1.1s,
             transform 1.1s cubic-bezier(.22,.61,.36,1),
             left .5s cubic-bezier(.4,0,.2,1),
             right .5s cubic-bezier(.4,0,.2,1);
  cursor:pointer;
  z-index:2;
}

/* 偶数：图片在左，右边留文字列 */
.card:nth-child(even) .card-main{
  left:0;
  right:88px;
  transform:translateX(-56px);
}

/* 入场 */
.card.show .card-main{
  opacity:1;
  visibility:visible;
  transform:translateX(0);
}

/* 点击：图片向文字方向扩展覆盖文字 */
.card-main.expanding{
  left:0 !important;
  right:0 !important;
  border-radius:25px;
}

.card-main:active{ filter:brightness(.92); }

@media (hover:hover){
  .card-main:hover{ filter:brightness(1.06); }
}

.card-img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
  transition:filter .4s cubic-bezier(.22,.61,.36,1);
}

/* 卡片标题 — 竖排大字 */
.card-title{
  font-size:52px;
  font-weight:700;
  line-height:1;
  letter-spacing:.04em;
  color:var(--text);
  writing-mode:vertical-rl;
  text-orientation:mixed;
  transition:color .35s cubic-bezier(.22,.61,.36,1);
}

/* 英文竖排字母较长，缩小保证不超出 */
body.lang-en .card-title{
  font-size:28px;
  letter-spacing:-.02em;
}

body.lang-jp .card-title{
  font-size:44px;
  letter-spacing:.02em;
  text-align:center;
}



.card-footer{ display:none; }





/* ================= Contact CTA ================= */

.contact-cta{
  max-width:980px;
  margin:0 auto;
  width:100%;
  padding:48px 24px 32px;
  text-align:center;
  opacity:0;
  transform:translateY(16px);
  transition:opacity .6s cubic-bezier(.22,.61,.36,1), transform .6s cubic-bezier(.22,.61,.36,1);
}

.contact-cta.show{
  opacity:1;
  transform:translateY(0);
}

.contact-cta-heading{
  font-size:40px;
  font-weight:700;
  line-height:1.14;
  letter-spacing:0.011em;
  color:var(--text);
  margin-bottom:12px;
  transition:color .35s cubic-bezier(.22,.61,.36,1);
}

.contact-cta-sub{
  font-size:21px;
  font-weight:400;
  line-height:1.24;
  letter-spacing:-0.005em;
  color:var(--text3);
  transition:color .35s cubic-bezier(.22,.61,.36,1);
}

/* ================= Contact Divider ================= */

.contact-divider{
  padding:0 24px;
  margin:0 auto 20px;
  max-width:980px;
  width:100%;
  color:var(--text3);
  font-size:12px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding-top:32px;
  opacity:0;
  transform:translateY(12px);
  transition:opacity .5s cubic-bezier(.22,.61,.36,1), transform .5s cubic-bezier(.22,.61,.36,1), color .35s cubic-bezier(.22,.61,.36,1), border-color .35s cubic-bezier(.22,.61,.36,1);
}

.contact-divider.show{
  opacity:1;
  transform:translateY(0);
}

/* ================= Contact Items ================= */

.contact-area{
  background:var(--bg);
  border-top:1px solid var(--border2);
  padding-bottom:0;
  transition:background .35s cubic-bezier(.22,.61,.36,1), border-color .35s cubic-bezier(.22,.61,.36,1);
}

.contact-list{
  padding:0 24px 70px;
  display:flex;
  flex-direction:column;
  gap:12px;
  max-width:980px;
  margin:0 auto;
  width:100%;
}

.contact-item{
  display:flex;
  align-items:center;
  gap:16px;
  padding:12px 0;
  border-radius:0;
  background:transparent;
  border:none;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  opacity:0;
  visibility:hidden;
  position:relative;
  overflow:hidden;
  transform:translateX(-24px);
  transition:opacity .45s cubic-bezier(.22,.61,.36,1), visibility .45s cubic-bezier(.22,.61,.36,1), transform .45s cubic-bezier(.22,.61,.36,1), border-color .35s cubic-bezier(.22,.61,.36,1);
}

@media (hover:hover){
  .contact-item:hover .contact-name{ color:var(--accent); }
  .contact-item:hover .contact-arrow{ color:var(--accent); }
}

body.theme-light .contact-item:hover .contact-name{ color:var(--accent-link); }
body.theme-light .contact-item:hover .contact-arrow{ color:var(--accent-link); }

.contact-item.show{ opacity:1; visibility:visible; transform:translateX(0); }

.contact-item:active{ opacity:.7; transition:opacity .1s; }

.contact-icon{
  width:32px;
  height:32px;
  border-radius:6px;
  background:color-mix(in srgb, var(--platform-color) 14%, transparent);
  color:var(--platform-color);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  transition:background .35s cubic-bezier(.22,.61,.36,1), color .35s cubic-bezier(.22,.61,.36,1);
}

/* 浅色模式图标去彩色背景，用纯色更Apple */
body.theme-light .contact-icon{
  background:transparent;
  color:var(--text3);
}

/* X和抖音品牌色#010101在深色背景下不可见，单独覆盖 */
.contact-item[style*="010101"] .contact-icon{
  background:rgba(255,255,255,.10);
  color:rgba(255,255,255,.80);
}

<script>

/* ================= Splash ================= */

/* 保底：最多等4秒，不管资源有没有加载完 */
const splashStart = Date.now();
function showPage() {
  if (window.__pageShown) return;
  window.__pageShown = true;
  if (window.innerWidth <= 180) {
    const page = document.querySelector(".page");
    page.style.opacity = 1;
    page.style.visibility = "visible";
    document.body.style.overflow = "auto";
    startPage();
    return;
  }
  setTimeout(() => {
    document.getElementById("splash").classList.add("fade");
    const page = document.querySelector(".page");
    page.style.opacity = 1;
    page.style.visibility = "visible";
    document.body.style.overflow = "auto";
    startPage();
  }, 2050);
}

window.addEventListener("load", showPage);
setTimeout(showPage, 4000); /* 保底4秒 */

/* 返回页面时重置所有状态 */
window.addEventListener("pageshow", (e) => {
  document.querySelector(".page")?.classList.remove("nav-out");
  /* 返回时重置所有扩展中的卡片 */
  document.querySelectorAll(".card-main.expanding").forEach(el => {
    el.classList.remove("expanding");
    /* 强制reflow，确保transition重置生效 */
    void el.offsetWidth;
  });
});

/* ================= Navigate ================= */

function navigateTo(url) {
  if (!url || url === "#") return;
  const page = document.querySelector(".page");
  page.classList.add("nav-out");
  setTimeout(() => { window.location.href = url; }, 360);
}


/* ================= Main ================= */

function startPage() {
  const isWatch = window.innerWidth <= 180;

  /* Hero 入场 */
  setTimeout(() => {
    document.getElementById("heroContent").classList.add("show");
  }, 100);

  /* 卡片入场 */
  const cards = [...document.querySelectorAll(".card")];
  const cardObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) e.target.classList.add("show");
      else e.target.classList.remove("show");
    });
  }, {threshold:.12});

  cards.forEach(c => cardObs.observe(c));

  /* contact-cta 入场 */
  const cta = document.querySelector(".contact-cta");
  if (cta) {
    const ctaObs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add("show"); ctaObs.unobserve(e.target); }
      });
    }, {threshold:.2});
    ctaObs.observe(cta);
  }

  /* contact-divider 入场 */
  const divider = document.querySelector(".contact-divider");
  if (divider) {
    const divObs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add("show");
          divObs.unobserve(e.target);
        }
      });
    }, {threshold:.2});
    divObs.observe(divider);
  }
  cards.forEach(card => {
    const main = card.querySelector(".card-main");
    if (!main) return;
    main.addEventListener("click", () => {
      if (main.classList.contains("expanding")) return;
      main.classList.add("expanding");
      setTimeout(() => navigateTo(card.dataset.href), 480);
    });
  });

  /* copyright 入场 */
  const copy = document.getElementById("copyright");
  if (copy) {
    const copyObs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add("show");
          copyObs.unobserve(e.target);
        }
      });
    }, {threshold:.3});
    copyObs.observe(copy);
  }

  if (isWatch) return;

  const header     = document.getElementById("mainHeader");

  /* header title 点击回顶部 */
  document.getElementById("headerTitle").addEventListener("click", () => {
    window.scrollTo({ top:0, behavior:"smooth" });
  });

  /* Hero 视差 + header 状态 + scroll箭头隐藏 */
  const heroBg = document.getElementById("heroBg");
  const heroH  = document.querySelector(".hero").offsetHeight;

  addEventListener("scroll", () => {
    const sy = scrollY;

    /* 视差 */
    heroBg.style.transform = `translate3d(0,${sy * 0.32}px,0)`;

    /* header 背景 & title */
    if (sy > heroH * 0.6) {
      header.classList.add("show-title");
    } else {
      header.classList.remove("show-title");
    }

  }, {passive:true});
}

/* ================= Theme ================= */

function setTheme(theme, originEl) {
  localStorage.setItem("theme", theme);

  if (originEl) {
    const ripple = document.getElementById("theme-ripple");
    const rect   = originEl.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;
    const maxR = Math.hypot(
      Math.max(cx, window.innerWidth  - cx),
      Math.max(cy, window.innerHeight - cy)
    ) * 2;

    const rippleColor = theme === "light" ? "#f0f4f8" : "#071720";
    const circle = document.createElement("div");
    circle.style.cssText = `
      position:absolute; left:${cx}px; top:${cy}px;
      width:0; height:0; border-radius:50%;
      background:${rippleColor};
      transform:translate(-50%,-50%) scale(0);
      animation:rippleExpand .55s cubic-bezier(.22,.61,.36,1) forwards;
      pointer-events:none;
    `;

    if (!document.getElementById("ripple-style")) {
      const st = document.createElement("style");
      st.id = "ripple-style";
      st.textContent = `@keyframes rippleExpand{ to{ width:${maxR}px; height:${maxR}px; opacity:0; } }`;
      document.head.appendChild(st);
    }

    ripple.appendChild(circle);
    setTimeout(() => circle.remove(), 600);
  }

  setTimeout(() => {
    if (theme === "light") document.body.classList.add("theme-light");
    else document.body.classList.remove("theme-light");
  }, 60);
}

const savedTheme = localStorage.getItem("theme") || "dark";
setTheme(savedTheme, null);

document.getElementById("themeBtn").addEventListener("click", function() {
  setTheme(document.body.classList.contains("theme-light") ? "dark" : "light", this);
});

const EXTERNAL_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;

const contactObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      /* stagger：每条延迟60ms */
      const idx = parseInt(e.target.dataset.idx || 0);
      setTimeout(() => e.target.classList.add("show"), idx * 60);
      contactObs.unobserve(e.target);
    }
  });
}, {threshold:.08});

function renderContacts(lang) {
  const list  = document.getElementById("contactList");
  const items = CONTACTS[lang] || CONTACTS.zh;
  list.querySelectorAll(".contact-item").forEach(el => contactObs.unobserve(el));
  list.innerHTML = items.map((p, i) => `
    <div class="contact-item" style="--platform-color:${p.color};" data-url="${encodeURIComponent(p.url)}" data-idx="${i}">
      <div class="contact-icon">${ICONS[p.id]||""}</div>
      <span class="contact-name">${p.name}</span>
      <button class="contact-arrow" type="button" aria-label="打开"><span class="arrow-icon">${EXTERNAL_ICON}</span></button>
    </div>
  `).join("");
  list.querySelectorAll(".contact-item").forEach(item => {
    const url = decodeURIComponent(item.dataset.url);
    const btn = item.querySelector(".contact-arrow");

    const go = () => {
      navigateTo(url);
    };

    /* 整个条目点击跳转 */
    item.addEventListener("click", go);
    /* 箭头单独绑定，阻止冒泡避免双触发，但自己负责跳转 */
    if (btn) btn.addEventListener("click", e => { e.stopPropagation(); go(); });

    contactObs.observe(item);
  });
}

function setLang(lang, animate = false) {
  localStorage.setItem("lang", lang);
  document.body.classList.remove("lang-zh","lang-en","lang-jp");
  document.body.classList.add(`lang-${lang}`);

  const htmlLang = {zh:"zh-CN", en:"en", jp:"ja"};
  document.documentElement.lang = htmlLang[lang] || "zh-CN";

  const titles = {zh:"凌绡 | Crythane", en:"Crythane", jp:"凌绡 | Crythane"};
  document.title = titles[lang] || "Crythane";

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (LANG[lang] && LANG[lang][key]) el.textContent = LANG[lang][key];
  });

  document.getElementById("copyright").textContent = LANG[lang].copyright;
  renderContacts(lang);
}

const savedLang = localStorage.getItem("lang") || "zh";

langBtn.onclick = (e) => { e.stopPropagation(); langMenu.classList.toggle("show"); };

langMenu.querySelectorAll("[data-lang]").forEach(item => {
  item.onclick = () => { setLang(item.dataset.lang); langMenu.classList.remove("show"); };
});

document.addEventListener("click", (e) => {
  if (!langMenu.contains(e.target) && !langBtn.contains(e.target)) {
    langMenu.classList.remove("show");
  }
});

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Crythane</title>
<style>

/* ================= Fonts ================= */

@font-face{ font-family:"Righteous"; src:url("fonts/Righteous-Regular.ttf"); font-display:swap; }
@font-face{ font-family:"Urbanist";  src:url("fonts/Urbanist-Bold.ttf");     font-display:swap; }
@font-face{ font-family:"Alimama";   src:url("fonts/AlimamaShuHeiTi-Bold.ttf"); font-display:swap; }
@font-face{ font-family:"Harmony";   src:url("fonts/HarmonyOS_Sans_SC_Regular.ttf"); font-display:swap; }
@font-face{ font-family:"Kazesawa";  src:url("fonts/Kazesawa-Bold.ttf");     font-display:swap; }

/* ================= Theme Variables ================= */

:root{
  --bg:        #081921;
  --bg2:       rgba(20,31,38,.74);
  --bg3:       rgba(16,24,31,.68);
  --header-bg: rgba(8,25,33,.52);
  --menu-bg:   rgba(18,26,34,.92);
  --text:      #eef7f8;
  --text2:     rgba(255,255,255,.94);
  --text3:     rgba(255,255,255,.72);
  --border:    rgba(255,255,255,.05);
  --border2:   rgba(255,255,255,.06);
  --border3:   rgba(255,255,255,.08);
  --btn-bg:    rgba(255,255,255,.05);
  --accent:    #73e6eb;
  --accent-border: rgba(115,230,235,.35);
  --card-img-overlay: rgba(14,22,28,.16);
  --splash-bg: #081921;
  --radius:    32px;
  --shadow:    0 16px 40px rgba(0,0,0,.28);
  --shadow-hover: 0 28px 60px rgba(0,0,0,.44);
  --avatar-shadow: 0 12px 40px rgba(0,0,0,.36);
}

body.theme-light{
  --bg:        #f0f4f8;
  --bg2:       rgba(255,255,255,.82);
  --bg3:       rgba(240,244,250,.90);
  --header-bg: rgba(240,244,250,.70);
  --menu-bg:   rgba(255,255,255,.95);
  --text:      #1a2535;
  --text2:     rgba(20,35,55,.92);
  --text3:     rgba(20,35,55,.55);
  --border:    rgba(0,0,0,.07);
  --border2:   rgba(0,0,0,.08);
  --border3:   rgba(0,0,0,.10);
  --btn-bg:    rgba(0,0,0,.04);
  --accent:    #2ab8c4;
  --accent-border: rgba(42,184,196,.38);
  --card-img-overlay: rgba(240,244,250,.08);
  --splash-bg: #f0f4f8;
  --shadow:    0 16px 40px rgba(0,0,0,.10);
  --shadow-hover: 0 28px 60px rgba(0,0,0,.18);
  --avatar-shadow: 0 12px 40px rgba(0,0,0,.14);
}

/* ================= Base ================= */

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ scroll-behavior:smooth; }

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Urbanist","Alimama",-apple-system,sans-serif;
  overflow:hidden;
  transition:background .35s, color .35s;
}

body.lang-zh{ font-family:"Urbanist","Alimama",-apple-system,sans-serif; }
body.lang-en{ font-family:"Urbanist",-apple-system,sans-serif; }
body.lang-jp{ font-family:"Kazesawa","Urbanist",sans-serif; }

/* ================= Theme Ripple ================= */

#theme-ripple{
  position:fixed;
  inset:0;
  z-index:998;
  pointer-events:none;
  overflow:hidden;
}

/* ================= Splash ================= */

#splash{
  position:fixed;
  inset:0;
  background:var(--splash-bg);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
  transition:background .35s;
}

#logo{ width:340px; max-width:74vw; }

#logo text{
  font-family:"Righteous";
  font-size:96px;
  fill:none;
  stroke:var(--accent);
  stroke-width:3.2;
  stroke-dasharray:700;
  stroke-dashoffset:700;
  animation:
    draw 1.7s cubic-bezier(.22,.61,.36,1) forwards,
    fill-text .55s ease forwards 1.65s;
}

@keyframes draw{ to{ stroke-dashoffset:0; } }
@keyframes fill-text{ to{ fill:var(--accent); } }
#splash.fade{ animation:splashOut .85s ease forwards; }
@keyframes splashOut{ to{ opacity:0; visibility:hidden; } }

/* ================= Page ================= */

.page{
  opacity:0;
  visibility:hidden;
  transition:opacity .7s, visibility .7s;
}

/* ================= Header ================= */

.header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:10;
  padding:calc(16px + env(safe-area-inset-top)) 24px 16px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:transparent;
  transition:background .4s, backdrop-filter .4s;
}

.header.scrolled{
  background:var(--header-bg);
  backdrop-filter:blur(26px) saturate(160%);
  -webkit-backdrop-filter:blur(26px) saturate(160%);
}

.title{
  font-family:"Righteous";
  font-size:30px;
  letter-spacing:.5px;
  color:#fff;
  opacity:0;
  visibility:hidden;
  transform:translateY(-10px);
  transition:
    opacity .55s cubic-bezier(.22,.61,.36,1),
    transform .55s cubic-bezier(.22,.61,.36,1),
    visibility .55s;
}

.header.show-title .title{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

/* title 在浅色模式滚动后跟随主题色 */
body.theme-light .header.scrolled .title{
  color:var(--accent);
}

/* ================= Theme Switch ================= */

.theme-switch{
  position:absolute;
  left:24px;
  top:50%;
  transform:translateY(-50%);
}

.theme-btn{
  width:40px;
  height:32px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.08);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:border-color .35s, background .35s, color .35s, transform .18s;
}

/* 滚动后跟随主题 */
.header.scrolled .theme-btn{
  border-color:var(--accent-border);
  background:var(--btn-bg);
  color:var(--accent);
}

.theme-btn:active{ transform:scale(.92); }

.theme-btn svg{
  width:18px;
  height:18px;
  position:absolute;
  transition:opacity .25s, transform .35s cubic-bezier(.34,1.56,.64,1);
}

.theme-btn .icon-moon{ opacity:1; transform:rotate(0deg) scale(1); }
.theme-btn .icon-sun{  opacity:0; transform:rotate(-90deg) scale(.5); }
body.theme-light .theme-btn .icon-moon{ opacity:0; transform:rotate(90deg) scale(.5); }
body.theme-light .theme-btn .icon-sun{  opacity:1; transform:rotate(0deg) scale(1); }

/* ================= Language ================= */

.lang-switch{
  position:absolute;
  right:24px;
  top:50%;
  transform:translateY(-50%);
}

.lang-btn{
  width:40px;
  height:32px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.08);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:border-color .35s, background .35s, color .35s, transform .18s;
}

.header.scrolled .lang-btn{
  border-color:var(--accent-border);
  background:var(--btn-bg);
  color:var(--accent);
}

.lang-btn:active{ transform:scale(.92); }
.lang-btn svg{ width:18px; height:18px; }

.lang-menu{
  position:absolute;
  right:0;
  top:42px;
  display:flex;
  flex-direction:column;
  background:var(--menu-bg);
  border-radius:12px;
  padding:8px 0;
  opacity:0;
  pointer-events:none;
  transform:translateY(-6px) scale(.97);
  transform-origin:top right;
  transition:opacity .22s, transform .22s cubic-bezier(.34,1.56,.64,1);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 10px 35px rgba(0,0,0,.18);
  border:1px solid var(--border2);
}

.lang-menu.show{ opacity:1; pointer-events:auto; transform:translateY(0) scale(1); }

.lang-menu div{
  padding:10px 18px;
  cursor:pointer;
  font-size:14px;
  white-space:nowrap;
  color:var(--text);
  transition:background .18s;
}

.lang-menu div:hover{ background:var(--border); }

/* ================= Hero ================= */

.hero{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
}

.hero-bg{
  position:absolute;
  inset:0;
  background-image:url("fonts/Background.jpeg");
  background-size:cover;
  background-position:center;
  /* 视差：JS 驱动 */
  will-change:transform;
  transition:transform .05s linear;
}

/* 渐变遮罩：底部让文字可读，顶部不过曝 */
.hero-bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      rgba(8,25,33,.18) 0%,
      rgba(8,25,33,0)   30%,
      rgba(8,25,33,0)   50%,
      rgba(8,25,33,.55) 80%,
      rgba(8,25,33,.88) 100%
    );
}

/* 浅色模式遮罩调整 */
body.theme-light .hero-bg::after{
  background:
    linear-gradient(
      to bottom,
      rgba(240,244,248,.22) 0%,
      rgba(240,244,248,0)   30%,
      rgba(240,244,248,0)   50%,
      rgba(240,244,248,.55) 80%,
      rgba(240,244,248,.92) 100%
    );
}

.hero-content{
  position:relative;
  z-index:2;
  padding:0 40px 64px;
  width:100%;
}

/* 中文大标题 */
.hero-name-zh{
  font-family:"Alimama",sans-serif;
  font-size:clamp(52px, 12vw, 96px);
  line-height:1;
  color:#fff;
  letter-spacing:.04em;
  margin:0 0 6px;
  /* 入场 */
  opacity:0;
  transform:translateY(30px);
  transition:opacity .8s .1s cubic-bezier(.22,.61,.36,1), transform .8s .1s cubic-bezier(.22,.61,.36,1);
}

body.theme-light .hero-name-zh{ color:#1a2535; }

/* 英文副标题 */
.hero-name-en{
  font-family:"Righteous",sans-serif;
  font-size:clamp(22px, 5vw, 40px);
  line-height:1;
  color:var(--accent);
  letter-spacing:.12em;
  margin:0 0 20px;
  opacity:0;
  transform:translateY(24px);
  transition:opacity .8s .22s cubic-bezier(.22,.61,.36,1), transform .8s .22s cubic-bezier(.22,.61,.36,1);
}

/* tagline */
.hero-tagline{
  font-size:clamp(13px, 3vw, 17px);
  color:rgba(255,255,255,.62);
  letter-spacing:.06em;
  margin:0 0 36px;
  opacity:0;
  transform:translateY(18px);
  transition:opacity .8s .34s cubic-bezier(.22,.61,.36,1), transform .8s .34s cubic-bezier(.22,.61,.36,1);
}

body.theme-light .hero-tagline{ color:rgba(20,35,55,.5); }

/* 入场触发 */
.hero-content.show .hero-name-zh,
.hero-content.show .hero-name-en,
.hero-content.show .hero-tagline,
.hero-content.show .hero-scroll{
  opacity:1;
  transform:translateY(0);
}

/* 向下滚动箭头 */
.hero-scroll{
  display:flex;
  align-items:center;
  gap:10px;
  color:rgba(255,255,255,.5);
  font-size:13px;
  letter-spacing:.1em;
  cursor:pointer;
  width:fit-content;
  opacity:0;
  transform:translateY(14px);
  transition:opacity .8s .48s cubic-bezier(.22,.61,.36,1), transform .8s .48s cubic-bezier(.22,.61,.36,1), color .2s;
}

.hero-scroll:hover{ color:rgba(255,255,255,.85); }

body.theme-light .hero-scroll{ color:rgba(20,35,55,.4); }
body.theme-light .hero-scroll:hover{ color:rgba(20,35,55,.75); }

.hero-scroll svg{
  width:20px;
  height:20px;
  animation:scrollBounce 2s ease-in-out infinite;
}

@keyframes scrollBounce{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(5px); }
}

/* ================= Section（卡片区） ================= */

.section{
  background:var(--bg);
  padding-top:56px;
  transition:background .35s;
}

/* ================= Cards ================= */

.card-list{
  padding:0 24px 70px;
  display:flex;
  flex-direction:column;
  gap:28px;
}

.card{
  border-radius:var(--radius);
  overflow:hidden;
  opacity:0;
  visibility:hidden;
  transform:translateY(32px);
  transition:opacity .65s cubic-bezier(.22,.61,.36,1), transform .65s cubic-bezier(.22,.61,.36,1), visibility .65s;
  background:var(--bg2);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  cursor:pointer;
}

.card.show{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

@media (hover:hover){
  .card:hover{
    transform:translateY(-6px) scale(1.012);
    box-shadow:var(--shadow-hover);
  }
}

.card:active{ transform:scale(.975); transition:transform .12s; }

.card-main{
  aspect-ratio:5/3;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  position:relative;
  overflow:hidden;
}

.card-main::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--card-img-overlay);
}

.card-main::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.22),rgba(0,0,0,0));
}

.card-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 24px;
  background:var(--bg3);
  border-top:1px solid var(--border2);
  font-size:20px;
  color:var(--text2);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  transition:background .35s, color .35s, border-color .35s;
}

.arrow-btn{
  width:52px;
  height:52px;
  border-radius:50%;
  border:1px solid var(--border3);
  background:var(--btn-bg);
  color:var(--text2);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:background .35s, border-color .35s, color .35s, transform .18s;
  flex-shrink:0;
}

.arrow-btn:active{ transform:scale(.88); }
.arrow-btn svg{ width:22px; height:22px; }

/* ================= iOS Card Expand ================= */

#card-expand{
  position:fixed;
  z-index:997;
  border-radius:var(--radius);
  overflow:hidden;
  pointer-events:none;
  opacity:0;
  background:var(--bg2);
  will-change:transform,border-radius,opacity;
}

#card-expand.expanding{
  opacity:1;
  animation:cardExpand .46s cubic-bezier(.32,.72,0,1) forwards;
}

@keyframes cardExpand{
  to{ top:0; left:0; width:100vw; height:100vh; border-radius:0; transform:none; }
}

#card-expand-bg{
  position:fixed;
  inset:0;
  z-index:996;
  background:rgba(0,0,0,0);
  pointer-events:none;
  transition:background .38s;
}

#card-expand-bg.active{ background:rgba(0,0,0,.22); }

/* ================= Contact Divider ================= */

.contact-divider{
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 24px;
  margin:8px 0 20px;
  color:var(--text3);
  font-size:13px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.contact-divider::before,
.contact-divider::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--border2);
}

/* ================= Contact Items ================= */

.contact-list{
  padding:0 24px 70px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.contact-item{
  display:flex;
  align-items:center;
  gap:16px;
  padding:14px 18px;
  border-radius:18px;
  background:var(--bg2);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  cursor:pointer;
  opacity:0;
  visibility:hidden;
  transition:opacity .45s cubic-bezier(.22,.61,.36,1), visibility .45s, transform .18s, box-shadow .18s;
}

.contact-item.show{ opacity:1; visibility:visible; }

@media (hover:hover){
  .contact-item:hover{
    transform:translateY(-3px) scale(1.01);
    box-shadow:var(--shadow-hover);
  }
}

.contact-item:active{ transform:scale(.975); transition:transform .1s; }

.contact-icon{
  width:42px;
  height:42px;
  border-radius:12px;
  background:color-mix(in srgb, var(--platform-color) 18%, transparent);
  color:var(--platform-color);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  transition:background .35s;
}

.contact-icon svg{ width:20px; height:20px; }

.contact-name{
  flex:1;
  font-size:17px;
  color:var(--text2);
  transition:color .35s;
}

.contact-arrow{
  width:36px;
  height:36px;
  border-radius:50%;
  border:1px solid var(--border3);
  background:var(--btn-bg);
  color:var(--text3);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  cursor:pointer;
  transition:background .35s, color .35s, transform .14s;
}

.contact-arrow:active{ transform:scale(.88); }
.contact-arrow svg{ width:16px; height:16px; }

/* ================= Copyright ================= */

.copyright{
  text-align:center;
  padding:8px 24px 44px;
  font-size:13px;
  opacity:.42;
  letter-spacing:.25px;
  color:var(--text3);
  transition:color .35s;
}

body.lang-zh .copyright{ font-family:"Harmony","Alimama",sans-serif; }
body.lang-en .copyright{ font-family:"Urbanist",sans-serif; }
body.lang-jp .copyright{ font-family:"Kazesawa",sans-serif; }

/* =============================================
   RESPONSIVE
   ============================================= */

@media (max-width:320px){
  .hero-content{ padding:0 20px 48px; }
  .card-list{ padding:0 14px 60px; gap:18px; }
  .card-footer{ font-size:17px; padding:16px 18px; }
  .arrow-btn{ width:42px; height:42px; }
  .arrow-btn svg{ width:18px; height:18px; }
}

@media (min-width:900px) and (max-width:1299px){
  .card-list{ padding:0 40px 80px; display:grid; grid-template-columns:repeat(2,1fr); gap:28px; }
  .contact-list{ padding:0 40px 80px; }
  .contact-divider{ padding:0 40px; }
  .hero-content{ padding:0 64px 80px; }
}

@media (min-width:1300px){
  .card-list{ padding:0 12vw 90px; display:grid; grid-template-columns:repeat(2,1fr); gap:32px; }
  .contact-list{ padding:0 12vw 90px; }
  .contact-divider{ padding:0 12vw; }
  .hero-content{ padding:0 10vw 90px; }
}

/* Watch */
@media (max-width:180px){
  #splash{ display:none; }
  .page{ opacity:1 !important; visibility:visible !important; }
  body{ overflow:auto; }
  .hero{ height:50dvh; min-height:200px; }
  .hero-name-zh{ font-size:28px; }
  .hero-name-en{ font-size:14px; }
  .hero-tagline{ display:none; }
  .hero-scroll{ display:none; }
  .hero-content{ padding:0 12px 28px; }
  .header{ padding:6px 8px; }
  .lang-switch{ display:none; }
  .theme-switch{ display:none; }
  .title{ font-size:14px; opacity:1 !important; visibility:visible !important; transform:none !important; }
  .section{ padding-top:24px; }
  .card-list{ padding:0 8px 24px; gap:8px; display:flex; flex-direction:column; }
  .card{ border-radius:12px; }
  .card-main{ display:none; }
  .card-footer{ font-size:12px; padding:10px 12px; border-top:none; }
  .arrow-btn{ width:26px; height:26px; }
  .arrow-btn svg{ width:13px; height:13px; }
  .contact-list{ padding:0 8px 24px; gap:6px; }
  .contact-divider{ padding:0 8px; font-size:10px; }
  .contact-item{ padding:10px; border-radius:10px; gap:10px; }
  .contact-icon{ width:30px; height:30px; border-radius:8px; }
  .contact-icon svg{ width:14px; height:14px; }
  .contact-name{ font-size:12px; }
  .contact-arrow{ width:24px; height:24px; }
  .contact-arrow svg{ width:11px; height:11px; }
  .copyright{ font-size:9px; padding:4px 8px 16px; }
}

</style>
</head>

<body class="lang-zh">

<div id="theme-ripple"></div>
<div id="card-expand-bg"></div>
<div id="card-expand"></div>

<!-- Splash -->
<div id="splash">
  <svg id="logo" viewBox="0 0 600 160">
    <text x="50%" y="60%" text-anchor="middle">Crythane</text>
  </svg>
</div>

<div class="page">

  <!-- Header -->
  <div class="header" id="mainHeader">

    <div class="theme-switch">
      <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none">
          <path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
          <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
            stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="title">Crythane</div>

    <div class="lang-switch">

<script>

/* ================= Splash ================= */

window.addEventListener("load", () => {
  if (window.innerWidth <= 180) {
    const page = document.querySelector(".page");
    page.style.opacity = 1;
    page.style.visibility = "visible";
    document.body.style.overflow = "auto";
    startPage();
    return;
  }
  setTimeout(() => {
    document.getElementById("splash").classList.add("fade");
    const page = document.querySelector(".page");
    page.style.opacity = 1;
    page.style.visibility = "visible";
    document.body.style.overflow = "auto";
    startPage();
  }, 2000);
});

/* ================= iOS Card Expand ================= */

function navigateTo(url, cardEl) {
  if (!url || url === "#") return;
  const expand = document.getElementById("card-expand");
  const bg     = document.getElementById("card-expand-bg");
  const rect   = cardEl.getBoundingClientRect();

  expand.style.cssText = `
    top:${rect.top}px; left:${rect.left}px;
    width:${rect.width}px; height:${rect.height}px;
    border-radius:var(--radius); background:var(--bg2);
  `;

  const cardMain = cardEl.querySelector(".card-main");
  if (cardMain) {
    const bgImg = window.getComputedStyle(cardMain).backgroundImage;
    expand.style.backgroundImage    = bgImg;
    expand.style.backgroundSize     = "cover";
    expand.style.backgroundPosition = "center";
  } else {
    const pc = getComputedStyle(cardEl).getPropertyValue("--platform-color").trim();
    if (pc) expand.style.background = pc;
  }

  bg.classList.add("active");
  expand.offsetHeight;

  const existingKf = document.getElementById("expand-kf");
  if (existingKf) existingKf.remove();
  const kfStyle = document.createElement("style");
  kfStyle.id = "expand-kf";
  kfStyle.textContent = `
    @keyframes cardExpand{
      from{ top:${rect.top}px; left:${rect.left}px; width:${rect.width}px; height:${rect.height}px; border-radius:18px; opacity:1; }
      to{   top:0; left:0; width:100vw; height:100dvh; border-radius:0px; opacity:1; }
    }
  `;
  document.head.appendChild(kfStyle);
  expand.classList.add("expanding");
  setTimeout(() => { window.location.href = url; }, 440);
}

window.addEventListener("pageshow", (e) => {
  if (e.persisted) {
    const expand = document.getElementById("card-expand");
    const bg     = document.getElementById("card-expand-bg");
    expand.classList.remove("expanding");
    expand.style.cssText = "";
    bg.classList.remove("active");
  }
});

/* ================= Main ================= */

function startPage() {
  const isWatch = window.innerWidth <= 180;

  /* Hero 入场 */
  setTimeout(() => {
    document.getElementById("heroContent").classList.add("show");
  }, 100);

  /* 向下滚动按钮 */
  document.getElementById("heroScroll").addEventListener("click", () => {
    document.querySelector(".section").scrollIntoView({behavior:"smooth"});
  });

  /* 卡片入场 */
  const cards = [...document.querySelectorAll(".card")];
  const cardObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) e.target.classList.add("show");
      else e.target.classList.remove("show");
    });
  }, {threshold:.12});

  cards.forEach(c => cardObs.observe(c));
  cards.forEach(card => {
    card.addEventListener("click", () => navigateTo(card.dataset.href, card));
  });

  if (isWatch) return;

  const header = document.getElementById("mainHeader");

  /* Hero 视差 + header 状态 */
  const heroBg = document.getElementById("heroBg");
  const heroH  = document.querySelector(".hero").offsetHeight;

  addEventListener("scroll", () => {
    const sy = scrollY;

    /* 视差：背景移动比滚动慢 */
    heroBg.style.transform = `translateY(${sy * 0.38}px)`;

    /* header 背景 & title */
    if (sy > heroH * 0.6) {
      header.classList.add("scrolled","show-title");
    } else if (sy > 60) {
      header.classList.add("scrolled");
      header.classList.remove("show-title");
    } else {
      header.classList.remove("scrolled","show-title");
    }
  }, {passive:true});
}

/* ================= Theme ================= */

function setTheme(theme, originEl) {
  localStorage.setItem("theme", theme);

  if (originEl) {
    const ripple = document.getElementById("theme-ripple");
    const rect   = originEl.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;
    const maxR = Math.hypot(
      Math.max(cx, window.innerWidth  - cx),
      Math.max(cy, window.innerHeight - cy)
    ) * 2;

    const rippleColor = theme === "light" ? "#f0f4f8" : "#081921";
    const circle = document.createElement("div");
    circle.style.cssText = `
      position:absolute; left:${cx}px; top:${cy}px;
      width:0; height:0; border-radius:50%;
      background:${rippleColor};
      transform:translate(-50%,-50%) scale(0);
      animation:rippleExpand .55s cubic-bezier(.22,.61,.36,1) forwards;
      pointer-events:none;
    `;

    if (!document.getElementById("ripple-style")) {
      const st = document.createElement("style");
      st.id = "ripple-style";
      st.textContent = `@keyframes rippleExpand{ to{ width:${maxR}px; height:${maxR}px; opacity:0; } }`;
      document.head.appendChild(st);
    }

    ripple.appendChild(circle);
    setTimeout(() => circle.remove(), 600);
  }

  setTimeout(() => {
    if (theme === "light") document.body.classList.add("theme-light");
    else document.body.classList.remove("theme-light");
  }, 60);
}

const savedTheme = localStorage.getItem("theme") || "dark";
setTheme(savedTheme, null);

document.getElementById("themeBtn").addEventListener("click", function() {
  setTheme(document.body.classList.contains("theme-light") ? "dark" : "light", this);
});

function setLang(lang, animate = false) {
  localStorage.setItem("lang", lang);
  document.body.classList.remove("lang-zh","lang-en","lang-jp");
  document.body.classList.add(`lang-${lang}`);

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (LANG[lang] && LANG[lang][key]) el.textContent = LANG[lang][key];
  });

  document.getElementById("copyright").textContent = LANG[lang].copyright;
  renderContacts(lang);
}

const savedLang = localStorage.getItem("lang") || "zh";
setLang(savedLang);

/* ================= Lang Menu ================= */

const langBtn  = document.getElementById("langBtn");
const langMenu = document.getElementById("langMenu");

langBtn.onclick = (e) => { e.stopPropagation(); langMenu.classList.toggle("show"); };

langMenu.querySelectorAll("[data-lang]").forEach(item => {
  item.onclick = () => { setLang(item.dataset.lang); langMenu.classList.remove("show"); };
});

document.addEventListener("click", (e) => {
  if (!langMenu.contains(e.target) && !langBtn.contains(e.target)) {
    langMenu.classList.remove("show");
  }
});

</script>

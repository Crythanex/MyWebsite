<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Crythane</title>

<style>

/* ================= Fonts ================= */

@font-face{
  font-family:"Righteous";
  src:url("fonts/Righteous-Regular.ttf");
  font-display:swap;
}

@font-face{
  font-family:"Urbanist";
  src:url("fonts/Urbanist-Bold.ttf");
  font-display:swap;
}

@font-face{
  font-family:"Alimama";
  src:url("fonts/AlimamaShuHeiTi-Bold.ttf");
  font-display:swap;
}

@font-face{
  font-family:"Harmony";
  src:url("fonts/HarmonyOS_Sans_SC_Regular.ttf");
  font-display:swap;
}

@font-face{
  font-family:"Kazesawa";
  src:url("fonts/Kazesawa-Bold.ttf");
  font-display:swap;
}

/* ================= Theme Variables ================= */

/* 深色（默认） */
:root{
  --bg:        #0e1620;
  --bg2:       rgba(20,31,38,.74);
  --bg3:       rgba(16,24,31,.68);
  --header-bg: rgba(15,22,30,.52);
  --menu-bg:   rgba(18,26,34,.92);
  --text:      #eef7f8;
  --text2:     rgba(255,255,255,.94);
  --text3:     rgba(255,255,255,.72);
  --border:    rgba(255,255,255,.05);
  --border2:   rgba(255,255,255,.06);
  --border3:   rgba(255,255,255,.08);
  --btn-bg:    rgba(255,255,255,.05);
  --accent:    #73e6eb;
  --accent-border: rgba(115,230,235,.35);
  --card-img-overlay: rgba(14,22,28,.16);
  --splash-bg: #0e1620;
  --radius:    32px;
  --shadow:    0 16px 40px rgba(0,0,0,.28);
  --avatar-shadow: 0 12px 40px rgba(0,0,0,.36);
}

/* 浅色 */
body.theme-light{
  --bg:        #f0f4f8;
  --bg2:       rgba(255,255,255,.82);
  --bg3:       rgba(240,244,250,.90);
  --header-bg: rgba(240,244,250,.70);
  --menu-bg:   rgba(255,255,255,.95);
  --text:      #1a2535;
  --text2:     rgba(20,35,55,.92);
  --text3:     rgba(20,35,55,.55);
  --border:    rgba(0,0,0,.07);
  --border2:   rgba(0,0,0,.08);
  --border3:   rgba(0,0,0,.10);
  --btn-bg:    rgba(0,0,0,.04);
  --accent:    #2ab8c4;
  --accent-border: rgba(42,184,196,.38);
  --card-img-overlay: rgba(240,244,250,.08);
  --splash-bg: #f0f4f8;
  --shadow:    0 16px 40px rgba(0,0,0,.10);
  --avatar-shadow: 0 12px 40px rgba(0,0,0,.14);
}

/* ================= Base ================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Urbanist","Alimama",-apple-system,sans-serif;
  overflow:hidden;
  transition:background .35s, color .35s;
}

body.lang-zh{ font-family:"Urbanist","Alimama",-apple-system,sans-serif; }
body.lang-en{ font-family:"Urbanist",-apple-system,sans-serif; }
body.lang-jp{ font-family:"Kazesawa","Urbanist",sans-serif; }

/* ================= Splash ================= */

#splash{
  position:fixed;
  inset:0;
  background:var(--splash-bg);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
  transition:background .35s;
}

#logo{
  width:340px;
  max-width:74vw;
}

#logo text{
  font-family:"Righteous";
  font-size:96px;
  fill:none;
  stroke:var(--accent);
  stroke-width:3.2;
  stroke-dasharray:700;
  stroke-dashoffset:700;
  animation:
    draw 1.7s cubic-bezier(.22,.61,.36,1) forwards,
    fill-text .55s ease forwards 1.65s;
}

@keyframes draw{
  to{ stroke-dashoffset:0; }
}

@keyframes fill-text{
  to{ fill:var(--accent); }
}

#splash.fade{
  animation:splashOut .85s ease forwards;
}

@keyframes splashOut{
  to{ opacity:0; visibility:hidden; }
}

/* ================= Page ================= */

.page{
  opacity:0;
  transition:opacity .7s;
}

/* ================= Header ================= */

.header{
  position:sticky;
  top:0;
  z-index:10;
  padding:
    calc(16px + env(safe-area-inset-top))
    24px
    16px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:var(--header-bg);
  backdrop-filter:blur(26px) saturate(160%);
  -webkit-backdrop-filter:blur(26px) saturate(160%);
  transition:background .35s;
}

.title{
  font-family:"Righteous";
  font-size:30px;
  letter-spacing:.5px;
  color:var(--accent);
  /* 修复点点bug：用 visibility 代替纯 opacity */
  opacity:0;
  visibility:hidden;
  transform:translateY(-10px);
  transition:
    opacity .55s cubic-bezier(.22,.61,.36,1),
    transform .55s cubic-bezier(.22,.61,.36,1),
    visibility .55s,
    color .35s;
}

.header.show-title .title{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

/* ================= Theme Switch ================= */

.theme-switch{
  position:absolute;
  left:24px;
  top:50%;
  transform:translateY(-50%);
}

.theme-btn{
  width:40px;
  height:32px;
  border-radius:10px;
  border:1px solid var(--accent-border);
  background:var(--btn-bg);
  color:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:border-color .35s, background .35s, color .35s, transform .18s;
}

.theme-btn:active{
  transform:scale(.92);
}

.theme-btn svg{
  width:18px;
  height:18px;
  transition:opacity .2s, transform .35s;
}

/* 图标切换：深色时显示月亮，浅色时显示太阳 */
.theme-btn .icon-moon{ display:block; }
.theme-btn .icon-sun { display:none;  }

body.theme-light .theme-btn .icon-moon{ display:none;  }
body.theme-light .theme-btn .icon-sun { display:block; }

/* ================= Language ================= */

.lang-switch{
  position:absolute;
  right:24px;
  top:50%;
  transform:translateY(-50%);
}

.lang-btn{
  width:40px;
  height:32px;
  border-radius:10px;
  border:1px solid var(--accent-border);
  background:var(--btn-bg);
  color:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:border-color .35s, background .35s, color .35s, transform .18s;
}

.lang-btn:active{
  transform:scale(.92);
}

.lang-btn svg{
  width:18px;
  height:18px;
}

.lang-menu{
  position:absolute;
  right:0;
  top:42px;
  display:flex;
  flex-direction:column;
  background:var(--menu-bg);
  border-radius:12px;
  padding:8px 0;
  opacity:0;
  pointer-events:none;
  transform:translateY(-6px);
  transition:.25s;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 10px 35px rgba(0,0,0,.18);
  border:1px solid var(--border2);
}

.lang-menu.show{
  opacity:1;
  pointer-events:auto;
  transform:translateY(0);
}

.lang-menu div{
  padding:10px 18px;
  cursor:pointer;
  font-size:14px;
  white-space:nowrap;
  color:var(--text);
  transition:background .18s, color .18s;
}

.lang-menu div:hover{
  background:var(--border);
}

/* ================= Avatar ================= */

.avatar-wrap{
  display:flex;
  justify-content:center;
  margin:58px 0 30px;
}

.avatar{
  width:200px;
  height:200px;
  border-radius:50%;
  background-image:url("fonts/1000075580.jpeg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  box-shadow:var(--avatar-shadow);
  transition:box-shadow .35s;
}

/* ================= Intro ================= */

.intro{
  text-align:center;
  font-size:26px;
  margin-bottom:54px;
  /* 初始隐藏，防止原始文字在动画前泄漏成点点 */
  opacity:0;
  transition:.55s cubic-bezier(.22,.61,.36,1);
  color:var(--text);
}

.intro.absorb{
  transform:translateY(-70px);
  opacity:0;
}

/* ================= Apple Text ================= */

.apple-text span{
  display:inline-block;
  /* 修复点点bug：visibility:hidden 代替纯 opacity:0 */
  opacity:0;
  visibility:hidden;
  transform:translateY(14px);
  will-change:transform,opacity;
}

.apple-text span.show{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
  transition:
    opacity .55s cubic-bezier(.22,.61,.36,1),
    transform .55s cubic-bezier(.22,.61,.36,1),
    visibility .55s;
}

/* ================= Cards ================= */

.card-list{
  padding:0 24px 70px;
  display:flex;
  flex-direction:column;
  gap:28px;
}

.card{
  border-radius:var(--radius);
  overflow:hidden;
  /* 修复点点bug：加 visibility:hidden */
  opacity:0;
  visibility:hidden;
  transform:translateY(48px) scale(.965);
  filter:blur(8px);
  transition:.9s cubic-bezier(.16,1,.3,1);
  background:var(--bg2);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}

.card.show{
  opacity:1;
  visibility:visible;
  transform:translateY(0) scale(1);
  filter:blur(0);
}

.card-main{
  aspect-ratio:5/3;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  position:relative;
  overflow:hidden;
}

.card-main::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--card-img-overlay);
}

.card-main::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.22),rgba(0,0,0,0));
}

.card-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 24px;
  background:var(--bg3);
  border-top:1px solid var(--border2);
  font-size:20px;
  color:var(--text2);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  transition:background .35s, color .35s, border-color .35s;
}

.arrow-btn{
  width:52px;
  height:52px;
  border-radius:50%;
  border:1px solid var(--border3);
  background:var(--btn-bg);
  color:var(--text2);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:background .35s, border-color .35s, color .35s, transform .14s;
}

.arrow-btn:active{
  transform:scale(.88);
}

.arrow-btn svg{
  width:22px;
  height:22px;
}

/* ================= Copyright ================= */

.copyright{
  text-align:center;
  padding:8px 24px 44px;
  font-size:13px;
  opacity:.42;
  letter-spacing:.25px;
  color:var(--text3);
  transition:color .35s;
}

body.lang-zh .copyright{ font-family:"Harmony","Alimama",sans-serif; }
body.lang-en .copyright{ font-family:"Urbanist",sans-serif; }
body.lang-jp .copyright{ font-family:"Kazesawa",sans-serif; }

/* =============================================
   RESPONSIVE BREAKPOINTS
   ============================================= */

/* ── 小屏手机 ≤320px ── */
@media (max-width:320px){
  .avatar{ width:110px; height:110px; }
  .intro{ font-size:20px; margin-bottom:36px; }
  .card-list{ padding:0 14px 60px; gap:18px; }
  .card-footer{ font-size:17px; padding:16px 18px; }
  .arrow-btn{ width:42px; height:42px; }
  .arrow-btn svg{ width:18px; height:18px; }
}

/* ── iPad / 平板 900–1299px → 2列网格 ── */
@media (min-width:900px) and (max-width:1299px){
  .card-list{
    padding:0 40px 80px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:28px;
  }
  .avatar{ width:180px; height:180px; }
  .intro{ font-size:28px; }
  .avatar-wrap{ margin:64px 0 32px; }
}

/* ── 桌面 ≥1300px → 2列 + 大留白 ── */
@media (min-width:1300px){
  .card-list{
    padding:0 12vw 90px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:32px;
  }
  .avatar{ width:200px; height:200px; }
  .intro{ font-size:28px; }
}

/* ── Apple Watch ≤180px ── */
@media (max-width:180px){

  #splash{ display:none; }
  .page{ opacity:1 !important; }
  body{ overflow:auto; }

  .header{
    padding:8px 10px;
    justify-content:flex-start;
  }

  .lang-switch{ display:none; }
  .theme-switch{ display:none; }

  .title{
    font-size:16px;
    opacity:1 !important;
    visibility:visible !important;
    transform:none !important;
  }

  .avatar-wrap{ margin:24px 0 14px; }
  .avatar{ width:60px; height:60px; }

  .intro{
    font-size:12px;
    margin-bottom:16px;
    padding:0 8px;
    line-height:1.5;
  }

  .card-list{
    padding:0 8px 32px;
    gap:8px;
    display:flex;
    flex-direction:column;
  }

  .card{ border-radius:12px; }
  .card-main{ display:none; }

  .card-footer{
    font-size:12px;
    padding:10px 12px;
    border-top:none;
  }

  .arrow-btn{ width:26px; height:26px; flex-shrink:0; }
  .arrow-btn svg{ width:13px; height:13px; }

  .copyright{
    font-size:9px;
    padding:4px 8px 16px;
    letter-spacing:0;
  }
}

</style>

</head>

<script>

/* ================= Splash ================= */

window.addEventListener("load", () => {

  if (window.innerWidth <= 180) {
    document.body.style.overflow = "auto";
    document.querySelector(".page").style.opacity = 1;
    startPage();
    return;
  }

  setTimeout(() => {
    document.getElementById("splash").classList.add("fade");
    document.body.style.overflow = "auto";
    document.querySelector(".page").style.opacity = 1;
    startPage();
  }, 2000);

});

/* ================= Text Animation ================= */

function playAppleText(el) {
  el.style.opacity = "1"; // 先让容器可见，再逐字播放
  const text = el.textContent.trim();
  el.textContent = "";
  [...text].forEach((u, i) => {
    const s = document.createElement("span");
    s.innerHTML = u === " " ? "&nbsp;" : u;
    el.appendChild(s);
    setTimeout(() => s.classList.add("show"), i * 38);
  });
}

/* ================= Main ================= */

function startPage() {

  const isWatch = window.innerWidth <= 180;

  if (!isWatch) {
    playAppleText(document.querySelector(".intro"));
  }

  const obs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("show");
      } else {
        entry.target.classList.remove("show");
      }
    });
  }, { threshold: .15 });

  document.querySelectorAll(".card").forEach(c => obs.observe(c));

  if (isWatch) return;

  const header = document.querySelector(".header");
  const intro  = document.querySelector(".intro");

  addEventListener("scroll", () => {
    if (scrollY > 80) {
      header.classList.add("show-title");
      intro.classList.add("absorb");
    } else {
      header.classList.remove("show-title");
      intro.classList.remove("absorb");
    }
  }, { passive: true });
}

/* ================= Theme ================= */

function setTheme(theme) {
  localStorage.setItem("theme", theme);
  if (theme === "light") {
    document.body.classList.add("theme-light");
  } else {
    document.body.classList.remove("theme-light");
  }
}

const savedTheme = localStorage.getItem("theme") || "dark";
setTheme(savedTheme);

document.getElementById("themeBtn").onclick = () => {
  const isLight = document.body.classList.contains("theme-light");
  setTheme(isLight ? "dark" : "light");
};

/* ================= Language ================= */

const LANG = {
  zh: {
    intro:      "你好，这里是凌绡",
    intro_card: "自介",
    gallery:    "图库",
    commission: "约稿",
    projects:   "项目",
    contact:    "联络",
    friends:    "友链",
    donation:   "捐赠",
    copyright:  "版权所有 ©2023-2026 Crythane 保留所有权利"
  },

function setLang(lang, animate = false) {
  localStorage.setItem("lang", lang);
  document.body.classList.remove("lang-zh", "lang-en", "lang-jp");
  document.body.classList.add(`lang-${lang}`);

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (LANG[lang][key]) el.textContent = LANG[lang][key];
  });

  document.getElementById("copyright").textContent = LANG[lang].copyright;

  if (animate) {
    playAppleText(document.querySelector(".intro"));
  }
}

const savedLang = localStorage.getItem("lang") || "zh";
setLang(savedLang, false);

/* ================= Lang Menu ================= */

const langBtn  = document.getElementById("langBtn");
const langMenu = document.getElementById("langMenu");

langBtn.onclick = (e) => {
  e.stopPropagation();
  langMenu.classList.toggle("show");
};

langMenu.querySelectorAll("[data-lang]").forEach(item => {
  item.onclick = () => {
    setLang(item.dataset.lang, true);
    langMenu.classList.remove("show");
  };
});

document.addEventListener("click", (e) => {
  if (!langMenu.contains(e.target) && !langBtn.contains(e.target)) {
    langMenu.classList.remove("show");
  }
});

</script>
